<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#0b0d12">

<meta name="description"
content="Top 5 Leagues Live Football Scores">

<title>Top 5 Leagues - LiveScore</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #080a0f;
    color: #ffffff;
    padding-bottom: 75px;
}

button,
input {
    font-family: inherit;
}

/* =====================================================
   HEADER
===================================================== */

.header {
    position: sticky;
    top: 0;
    z-index: 1000;

    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        linear-gradient(
            100deg,
            #0aa86b,
            #087ff5
        );

    font-size: 17px;
    font-weight: 800;

    box-shadow:
        0 2px 12px rgba(0,0,0,.35);
}

.header-title {
    display: flex;
    align-items: center;
    gap: 7px;
}

/* =====================================================
   API KEY SETUP
===================================================== */

.api-setup {
    display: none;

    margin: 14px;

    padding: 18px;

    background: #171a21;

    border-radius: 14px;

    border: 1px solid #303642;
}

.api-setup.show {
    display: block;
}

.api-setup h3 {
    margin-top: 0;
}

.api-setup p {
    color: #9ba3af;
    font-size: 13px;
    line-height: 1.5;
}

.api-input {
    width: 100%;

    padding: 12px;

    background: #0c0f15;

    border: 1px solid #3b4350;

    border-radius: 8px;

    color: white;

    outline: none;
}

.api-input:focus {
    border-color: #168cff;
}

.save-key {
    width: 100%;

    margin-top: 10px;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #168cff;

    color: white;

    font-weight: bold;
}

/* =====================================================
   ADVERTISEMENT
===================================================== */

.ad {
    width: calc(100% - 28px);

    max-width: 380px;

    height: 60px;

    margin: 12px auto;

    background: #171717;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #555;

    font-size: 10px;
}

/* =====================================================
   SEARCH
===================================================== */

.search-area {
    padding: 5px 12px 10px;
}

.search-box {
    width: 100%;

    background: #171a20;

    border: 1px solid #292f39;

    color: white;

    padding: 12px 15px;

    border-radius: 24px;

    outline: none;

    font-size: 14px;
}

.search-box:focus {
    border-color: #168cff;
}

.search-box::placeholder {
    color: #777;
}

/* =====================================================
   LEAGUE BUTTONS
===================================================== */

.leagues {
    display: flex;

    overflow-x: auto;

    gap: 7px;

    padding: 5px 12px 11px;

    scrollbar-width: none;
}

.leagues::-webkit-scrollbar {
    display: none;
}

.league-btn {
    flex: 0 0 auto;

    border: none;

    background: #1c2027;

    color: #d7dbe2;

    padding: 9px 13px;

    border-radius: 20px;

    font-size: 11px;

    font-weight: bold;

    white-space: nowrap;

    cursor: pointer;
}

.league-btn.active {
    background: #168cff;

    color: white;

    box-shadow:
        0 3px 10px rgba(22,140,255,.25);
}

/* =====================================================
   TABS
===================================================== */

.tabs {
    display: flex;

    gap: 7px;

    padding: 3px 12px 8px;

    justify-content: center;
}

.tab {
    border: none;

    background: #1c2027;

    color: #bfc5ce;

    padding: 9px 14px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}

.tab.active {
    background: #168cff;

    color: white;
}

.tab.live.active {
    background: #e62d3f;
}

/* =====================================================
   REFRESH
===================================================== */

.refresh-area {
    display: flex;

    justify-content: center;

    padding: 2px 0 10px;
}

.refresh-btn {
    border: none;

    background: #20242b;

    color: #ddd;

    padding: 8px 17px;

    border-radius: 20px;

    font-size: 12px;

    font-weight: bold;

    cursor: pointer;
}

.refresh-btn:active {
    transform: scale(.96);
}

/* =====================================================
   SECTION TITLE
===================================================== */

.section-title {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 5px 13px 8px;

    font-size: 15px;

    font-weight: bold;
}

.match-count {
    color: #737b87;

    font-size: 11px;

    font-weight: normal;
}

/* =====================================================
   DATE HEADER
===================================================== */

.date-header {
    padding: 10px 13px 5px;

    color: #8f98a6;

    font-size: 12px;

    font-weight: bold;
}

/* =====================================================
   LOADING
===================================================== */

.loading {
    text-align: center;

    padding: 45px 15px;

    color: #888;
}

.spinner {
    width: 36px;

    height: 36px;

    border-radius: 50%;

    border: 4px solid #242932;

    border-top-color: #168cff;

    animation:
        spin 1s linear infinite;

    margin:
        0 auto 15px;
}

@keyframes spin {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}

/* =====================================================
   ERROR
===================================================== */

.error {
    margin: 15px;

    padding: 16px;

    background: #38171b;

    border:
        1px solid #69242c;

    border-radius: 12px;

    text-align: center;

    color: #ff9aa4;

    font-size: 13px;

    line-height: 1.5;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
    margin: 15px;

    padding: 30px 15px;

    background: #14171c;

    border-radius: 12px;

    text-align: center;

    color: #777;

    line-height: 1.6;
}

/* =====================================================
   MATCH CARD
===================================================== */

.match-card {

    margin: 7px 10px;

    padding: 11px 12px;

    background: #15181d;

    border-radius: 11px;

    border-left: 3px solid #168cff;

    transition: .2s;
}

.match-card.live-card {

    border-left-color: #ed3345;

    background:
        linear-gradient(
            90deg,
            #1b1518,
            #15181d
        );
}

/* =====================================================
   MATCH TOP
===================================================== */

.match-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 8px;
}

.league-name {

    color: #4da8ff;

    font-size: 10px;

    font-weight: bold;

    max-width: 70%;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.status {

    font-size: 10px;

    font-weight: bold;

    color: #7f8792;
}

.status.live {

    color: #ff4254;
}

/* =====================================================
   TEAM ROW
===================================================== */

.team-row {

    display: flex;

    align-items: center;

    min-height: 39px;
}

.team-info {

    flex: 1;

    display: flex;

    align-items: center;

    gap: 9px;

    min-width: 0;
}

.team-logo {

    width: 29px;

    height: 29px;

    object-fit: contain;

    flex-shrink: 0;
}

.team-name {

    font-size: 13px;

    font-weight: bold;

    color: #f1f3f5;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.score {

    width: 35px;

    text-align: right;

    font-size: 17px;

    font-weight: 800;
}

/* =====================================================
   MATCH TIME
===================================================== */

.match-time {

    text-align: center;

    color: #ffc107;

    font-size: 11px;

    font-weight: bold;

    padding: 3px 0 6px;
}

.live-minute {

    color: #ff3f51;

    font-size: 11px;

    font-weight: bold;
}

/* =====================================================
   MATCH FOOTER
===================================================== */

.match-footer {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-top: 5px;

    color: #5f6772;

    font-size: 9px;
}

.favorite-btn {

    border: none;

    background: transparent;

    color: #555d68;

    font-size: 17px;

    padding: 0;

    cursor: pointer;
}

.favorite-btn.active {

    color: #ffc107;
}

/* =====================================================
   FOOTER
===================================================== */

.app-footer {

    text-align: center;

    color: #4e555f;

    font-size: 9px;

    padding: 20px 10px;
}

/* =====================================================
   BOTTOM NAVIGATION
===================================================== */

.bottom-nav {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 999;

    height: 64px;

    display: flex;

    justify-content: space-around;

    align-items: center;

    background: #111419;

    border-top:
        1px solid #252a32;

    box-shadow:
        0 -4px 15px rgba(0,0,0,.35);
}

.nav-btn {

    flex: 1;

    height: 100%;

    border: none;

    background: transparent;

    color: #69717c;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 4px;

    font-size: 10px;

    cursor: pointer;
}

.nav-icon {

    font-size: 19px;
}

.nav-btn.active {

    color: #168cff;
}

.nav-btn.live-nav.active {

    color: #ef4050;
}

/* =====================================================
   HIDDEN
===================================================== */

.hidden {
    display: none !important;
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media (min-width: 700px) {

    body {
        max-width: 700px;

        margin: auto;

        border-left:
            1px solid #20242a;

        border-right:
            1px solid #20242a;
    }

    .bottom-nav {
        max-width: 700px;

        left: 50%;

        transform:
            translateX(-50%);
    }

}

</style>

</head>

<body>


<!-- ===================================================
     HEADER
=================================================== -->

<header class="header">

    <div class="header-title">

        ⚽

        <span>
            Top 5 Leagues - Live Scores
        </span>

    </div>

</header>


<!-- ===================================================
     API SETUP
=================================================== -->

<div
    id="apiSetup"
    class="api-setup">

    <h3>
        ⚙️ API Setup

    <p>
        Enter your API-Football key to load

<script>

/* =====================================================
   API CONFIGURATION
===================================================== */

/*
   IMPORTANT:

   We intentionally DO NOT put your API key here.

   The key is entered through the app and stored
   in your browser's localStorage.

   This prevents the key from being directly visible
   inside this public GitHub file.
*/

const API_URL =
    "https://v3.football.api-sports.io";


/* =====================================================
   LEAGUES
===================================================== */

const LEAGUES = {

    "39": "Premier League",

    "140": "La Liga",

    "135": "Serie A",

    "78": "Bundesliga",

    "61": "Ligue 1",

    "2": "Champions League"

};


/* =====================================================
   APP STATE
===================================================== */

let selectedLeague = "all";

let selectedTab = "live";

let matchesData = [];

let favorites =
    JSON.parse(
        localStorage.getItem("favoriteTeams") || "[]"
    );


/* =====================================================
   API KEY
===================================================== */

let API_KEY =
    localStorage.getItem("footballApiKey") || "";


/* =====================================================
   CHECK API KEY
===================================================== */

function checkApiKey() {

    const setup =
        document.getElementById("apiSetup");


    if (!API_KEY) {

        setup.classList.add("show");

        return false;

    }


    setup.classList.remove("show");

    return true;

}


/* =====================================================
   SAVE API KEY
===================================================== */

function saveApiKey() {

    const input =
        document.getElementById("apiKeyInput");


    const key =
        input.value.trim();


    if (!key) {

        alert("78a63e9c8e656a177573b35f55ab1f88");

        return;

    }


    API_KEY = key;


    localStorage.setItem(
        "footballApiKey",
        API_KEY
    );


    document
        .getElementById("apiSetup")
        .classList.remove("show");


    loadMatches();

}


/* =====================================================
   TODAY - NIGERIA
===================================================== */

function getToday() {

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Africa/Lagos",

                year: "numeric",

                month: "2-digit",

                day: "2-digit"
            }
        ).formatToParts(new Date());


    const year =
        parts.find(
            p => p.type === "year"
        ).value;


    const month =
        parts.find(
            p => p.type === "month"
        ).value;


    const day =
        parts.find(
            p => p.type === "day"
        ).value;


    return `${year}-${month}-${day}`;

}


/* =====================================================
   LOAD MATCHES
===================================================== */

async function loadMatches() {

    if (!checkApiKey()) {

        return;

    }


    const container =
        document.getElementById("matches");


    container.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading football matches...

        </div>

    `;


    try {

        const today =
            getToday();


        /*
           We use ONE fixtures request for today.

           This is more efficient than making separate
           requests for live/upcoming/results.
        */

        const url =
            `${API_URL}/fixtures?date=${today}&timezone=Africa/Lagos`;


        const response =
            await fetch(

                url,

                {

                    method: "GET",

                    headers: {

                        "x-apisports-key":
                            API_KEY

                    }

                }

            );


        const data =
            await response.json();


        console.log(
            "API response:",
            data
        );


        if (!response.ok) {

            throw new Error(
                "HTTP Error " +
                response.status
            );

        }


        if (
            data.errors &&
            Object.keys(data.errors).length
        ) {

            throw new Error(
                JSON.stringify(
                    data.errors
                )
            );

        }


        matchesData =
            data.response || [];


        renderMatches();

    }

    catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="error">

                ❌ Unable to load matches.

                <br><br>

                ${escapeHTML(
                    error.message
                )}

                <br><br>

                Try pressing Refresh.

            </div>

        `;

    }

}


/* =====================================================
   FILTER LEAGUE
===================================================== */

function filterLeague(matches) {

    return matches.filter(

        match => {

            const leagueId =
                String(
                    match.league?.id
                );


            if (
                !LEAGUES[leagueId]
            ) {

                return false;

            }


            if (
                selectedLeague !== "all" &&
                leagueId !==
                String(selectedLeague)
            ) {

                return false;

            }


            return true;

        }

    );

}


/* =====================================================
   FILTER TAB
===================================================== */

function filterTab(matches) {

    if (
        selectedTab === "live"
    ) {

        return matches.filter(

            match => {

                const status =
                    match.fixture
                        ?.status
                        ?.short;


                return [

                    "1H",
                    "HT",
                    "2H",
                    "ET",
                    "BT",
                    "P",
                    "LIVE"

                ].includes(status);

            }

        );

    }


    if (
        selectedTab === "upcoming"
    ) {

        return matches.filter(

            match => {

                const status =
                    match.fixture
                        ?.status
                        ?.short;


                return [

                    "NS",
                    "TBD"

                ].includes(status);

            }

        );

    }


    return matches.filter(

        match => {

            const status =
                match.fixture
                    ?.status
                    ?.short;


            return [

                "FT",
                "AET",
                "PEN"

            ].includes(status);

        }

    );

}


/* =====================================================
   SEARCH
===================================================== */

function filterSearch(matches) {

    const input =
        document
            .getElementById(
                "searchInput"
            )
            .value
            .trim()
            .toLowerCase();


    if (!input) {

        return matches;

    }


    return matches.filter(

        match => {

            const home =
                match.teams
                    ?.home
                    ?.name
                    ?.toLowerCase() || "";


            const away =
                match.teams
                    ?.away
                    ?.name
                    ?.toLowerCase() || "";


            const league =
                match.league
                    ?.name
                    ?.toLowerCase() || "";


            return (

                home.includes(input) ||

                away.includes(input) ||

                league.includes(input)

            );

        }

    );

}


/* =====================================================
   RENDER
===================================================== */

function renderMatches() {

    const container =
        document.getElementById(
            "matches"
        );


    let matches =
        filterLeague(
            matchesData
        );


    matches =
        filterTab(
            matches
        );


    matches =
        filterSearch(
            matches
        );


    /*
       Favorites page
    */

    if (
        selectedTab === "favorites"
    ) {

        matches =
            matches.filter(

                match => {

                    const home =
                        String(
                            match.teams
                                ?.home
                                ?.id
                        );


                    const away =
                        String(
                            match.teams
                                ?.away
                                ?.id
                        );


                    return (

                        favorites.includes(
                            home
                        ) ||

                        favorites.includes(
                            away
                        )

                    );

                }

            );

    }


    /*
       Sort by kickoff time
    */

    matches.sort(

        (a, b) =>

            new Date(
                a.fixture.date
            ) -

            new Date(
                b.fixture.date
            )

    );


    /*
       Count
    */

    document
        .getElementById(
            "matchCount"
        )
        .textContent =
            matches.length +
            (
                matches.length === 1
                ? " match"
                : " matches"
            );


    /*
       Empty
    */

    if (
        matches.length === 0
    ) {

        let message;


        if (
            selectedTab === "live"
        ) {

            message =
                "🔴 No live matches right now.";

        }

        else if (
            selectedTab === "upcoming"
        ) {

            message =
                "📅 No upcoming matches today.";

        }

        else if (
            selectedTab === "finished"
        ) {

            message =
                "✅ No finished matches today.";

        }

        else {

            message =
                "⭐ You haven't selected any favorite teams.";

        }


        container.innerHTML = `

            <div class="empty">

                ${message}

                <br>

                <br>

                Try another league or refresh.

            </div>

        `;

        return;

    }


    /*
       Render
    */

    container.innerHTML =
        matches
            .map(
                createMatchCard
            )
            .join("");

}


/* =====================================================
   CREATE MATCH CARD
===================================================== */

function createMatchCard(match) {

    const fixture =
        match.fixture || {};


    const league =
        match.league || {};


    const teams =
        match.teams || {};


    const home =
        teams.home || {};


    const away =
        teams.away || {};


    const goals =
        match.goals || {};


    const status =
        fixture.status || {};


    const statusCode =
        status.short || "";


    const isLive =
        [

            "1H",
            "HT",
            "2H",
            "ET",
            "BT",
            "P",
            "LIVE"

        ].includes(
            statusCode
        );


    /*
       Status text
    */

    let statusText =
        statusCode;


    if (isLive) {

        if (
            statusCode === "HT"
        ) {

            statusText =
                "HALF TIME";

        }

        else if (
            status.elapsed
        ) {

            statusText =
                status.elapsed +
                "'";

        }

        else {

            statusText =
                "LIVE";

        }

    }


    /*
       Upcoming time
    */

    let timeHTML = "";


    if (
        statusCode === "NS"
    ) {

        timeHTML = `

            <div class="match-time">

                ⏰
                ${formatTime(
                    fixture.date
                )}

            </div>

        `;

    }


    /*
       Favorite status
    */

    const homeId =
        String(
            home.id || ""
        );


    const awayId =
        String(
            away.id || ""
        );


    const isFavorite =

        favorites.includes(
            homeId
        ) ||

        favorites.includes(
            awayId
        );


    /*
       Venue
    */

    const venue =
        fixture.venue
        ?.name || "";


    /*
       Scores
    */

    const homeScore =
        goals.home ??
        "-";


    const awayScore =
        goals.away ??
        "-";


    return `

        <article
            class="match-card
            ${isLive ? "live-card" : ""}">


            <div class="match-top">

                <div class="league-name">

                    🏆
                    ${escapeHTML(
                        league.name ||
                        "Football"
                    )}

                </div>


                <div
                    class="status
                    ${isLive ? "live" : ""}">

                    ${
                        isLive
                        ? "🔴 "
                        : ""
                    }

                    ${escapeHTML(
                        statusText
                    )}

                </div>

            </div>


            ${timeHTML}


            <div class="team-row">

                <div class="team-info">

                    ${
                        home.logo
                        ? `

                            <img
                                class="team-logo"
                                src="${home.logo}"
                                alt=""
                                onerror="
                                this.style.display='none'
                                "
                            >

                        `
                        : ""
                    }


                    <span class="team-name">

                        ${escapeHTML(
                            home.name ||
                            "Home Team"
                        )}

                    </span>

                </div>


                <div class="score">

                    ${homeScore}

                </div>

            </div>


            <div class="team-row">

                <div class="team-info">

                    ${
                        away.logo
                        ? `

                            <img
                                class="team-logo"
                                src="${away.logo}"
                                alt=""
                                onerror="
                                this.style.display='none'
                                "
                            >

                        `
                        : ""
                    }


                    <span class="team-name">

                        ${escapeHTML(
                            away.name ||
                            "Away Team"
                        )}

                    </span>

                </div>


                <div class="score">

                    ${awayScore}

                </div>

            </div>


            <div class="match-footer">

                <span>

                    ${
                        venue
                        ? "🏟️ " +
                          escapeHTML(
                              venue
                          )
                        : ""
                    }

                </span>


                <button
                    class="
                    favorite-btn
                    ${isFavorite
                        ? "active"
                        : ""}"
                    onclick="
                    toggleFavorite(
                        '${homeId}',
                        '${awayId}'
                    )
                    "
                    title="Favorite teams">

                    ${
                        isFavorite
                        ? "★"
                        : "☆"
                    }

                </button>

            </div>


        </article>

    `;

}


/* =====================================================
   TIME
===================================================== */

function formatTime(
    dateString
) {

    if (!dateString) {

        return "";

    }


    return new Intl.DateTimeFormat(

        "en-NG",

        {

            timeZone:
                "Africa/Lagos",

            hour:
                "2-digit",

            minute:
                "2-digit",

            hour12:
                true

        }

    ).format(

        new Date(
            dateString
        )

    );

}


/* =====================================================
   FAVORITES
===================================================== */

function toggleFavorite(
    homeId,
    awayId
) {

    if (
        homeId &&
        !favorites.includes(homeId)
    ) {

        favorites.push(homeId);

    }


    if (
        awayId &&
        !favorites.includes(awayId)
    ) {

        favorites.push(awayId);

    }


    localStorage.setItem(

        "favoriteTeams",

        JSON.stringify(
            favorites
        )

    );


    renderMatches();

}


/* =====================================================
   SHOW FAVORITES
===================================================== */

function showFavorites() {

    selectedTab =
        "favorites";


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(

            btn =>
                btn.classList.remove(
                    "active"
                )

        );


    document
        .getElementById(
            "sectionTitle"
        )
        .textContent =
            "⭐ Favorite Teams";


    renderMatches();


    document
        .querySelectorAll(
            ".nav-btn"
        )
        .forEach(

            btn =>
                btn.classList.remove(
                    "active"
                )

        );

}


/* =====================================================
   SELECT LEAGUE
===================================================== */

function selectLeague(
    id,
    button
) {

    selectedLeague =
        id;


    document
        .querySelectorAll(
            ".league-btn"
        )
        .forEach(

            btn =>
                btn.classList.remove(
                    "active"
                )

        );


    button.classList.add(
        "active"
    );


    if (
        selectedTab ===
        "favorites"
    ) {

        selectedTab =
            "live";

    }


    renderMatches();

}


/* =====================================================
   CHANGE TAB
===================================================== */

function changeTab(
    tab,
    button
) {

    selectedTab =
        tab;


    document
        .querySelectorAll(
            ".tab"
        )
        .forEach(

            btn =>
                btn.classList.remove(
                    "active"
                )

        );


    if (button) {

        button.classList.add(
            "active"
        );

    }


    const title =
        document
            .getElementById(
                "sectionTitle"
            );


    if (
        tab === "live"
    ) {

        title.textContent =
            "🔴 Live Matches";

    }

    else if (
        tab === "upcoming"
    ) {

        title.textContent =
            "📅 Upcoming Matches";

    }

    else if (
        tab === "finished"
    ) {

        title.textContent =
            "✅ Results";

    }


    document
        .querySelectorAll(
            ".nav-btn"
        )
        .forEach(

            btn =>
                btn.classList.remove(
                    "active"
                )

        );


    renderMatches();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
