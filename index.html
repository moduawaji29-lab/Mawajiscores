<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.Awaji LiveScores</title>

<meta name="description"
content="M.Awaji LiveScores - Live football scores, fixtures and results">

<meta name="theme-color" content="#0b0d12">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0d12;
    color: #fff;
}

header {
    background: linear-gradient(135deg, #071a12, #063c2a, #075c43);
    padding: 20px 12px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 3px 15px rgba(0,0,0,.4);
}

header h1 {
    font-size: 25px;
    margin-bottom: 5px;
}

header p {
    font-size: 12px;
    opacity: .8;
}

.container {
    max-width: 700px;
    margin: auto;
    padding: 10px;
}

.leagues {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 8px 0;
    scrollbar-width: none;
}

.leagues::-webkit-scrollbar {
    display: none;
}

.leagues button {
    flex: none;
    border: 1px solid #285344;
    background: #121821;
    color: #fff;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
}

.leagues button.active {
    background: #00a86b;
    border-color: #00a86b;
}

.tabs {
    display: flex;
    margin: 8px 0;
    background: #121821;
    border-radius: 10px;
    padding: 4px;
}

.tabs button {
    flex: 1;
    border: 0;
    background: transparent;
    color: #aaa;
    padding: 11px 5px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.tabs button.active {
    background: #00a86b;
    color: #fff;
}

.datebar {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 8px 0;
    scrollbar-width: none;
}

.datebar::-webkit-scrollbar {
    display: none;
}

.datebar button {
    min-width: 90px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #29303a;
    background: #121821;
    color: #fff;
    cursor: pointer;
}

.datebar button.active {
    background: #075c43;
    border-color: #00a86b;
}

.refresh {
    width: 100%;
    border: 0;
    padding: 12px;
    margin: 10px 0;
    border-radius: 9px;
    background: #00a86b;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
}

.refresh:active {
    transform: scale(.98);
}

.status {
    background: #11161d;
    border-radius: 10px;
    padding: 10px;
    margin: 8px 0;
    font-size: 12px;
    text-align: center;
}

.error {
    color: #ff6b6b;
}

.success {
    color: #42e695;
}

.loading {
    text-align: center;
    padding: 30px;
    color: #aaa;
}

.match {
    background: #121821;
    border: 1px solid #202833;
    border-radius: 12px;
    margin: 10px 0;
    padding: 14px 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.2);
}

.competition {
    font-size: 11px;
    color: #00d084;
    margin-bottom: 12px;
    font-weight: bold;
}

.teams {
    display: grid;
    grid-template-columns: 1fr 80px 1fr;
    align-items: center;
    gap: 5px;
}

.team {
    text-align: center;
    font-size: 13px;
    line-height: 1.3;
}

.team img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    display: block;
    margin: 0 auto 7px;
}

.score {
    text-align: center;
    font-size: 21px;
    font-weight: bold;
}

.time {
    text-align: center;
    font-size: 11px;
    color: #aaa;
    margin-top: 5px;
}

.live {
    color: #ff4545;
    font-size: 11px;
    font-weight: bold;
    margin-top: 6px;
    text-align: center;
}

.live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    background: #ff4545;
    border-radius: 50%;
    margin-right: 4px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% {
        opacity: 1;
    }
    50% {
        opacity: .3;
    }
    100% {
        opacity: 1;
    }
}

.empty {
    text-align: center;
    padding: 35px 15px;
    color: #999;
}

.debug {
    background: #171c23;
    border: 1px solid #333;
    padding: 10px;
    border-radius: 8px;
    margin-top: 10px;
    font-size: 11px;
    word-break: break-word;
    display: none;
}

footer {
    text-align: center;
    padding: 25px 10px;
    color: #777;
    font-size: 11px;
}

@media (max-width: 450px) {

    header h1 {
        font-size: 22px;
    }

    .teams {
        grid-template-columns: 1fr 65px 1fr;
    }

    .team {
        font-size: 12px;
    }

    .team img {
        width: 36px;
        height: 36px;
    }

    .score {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header>
    <h1>⚽ M.Awaji LiveScores</h1>
    <p>Football Scores • Fixtures • Results</p>
</header>

<div class="container">

    <!-- LEAGUES -->

    <div class="leagues">

        <button class="active" data-league="PL">
            Premier League
        </button>

        <button data-league="PD">
            La Liga
        </button>

        <button data-league="SA">
            Serie A
        </button>

        <button data-league="BL1">
            Bundesliga
        </button>

        <button data-league="FL1">
            Ligue 1
        </button>

        <button data-league="CL">
            Champions League
        </button>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button class="active" data-tab="live">
            🔴 LIVE
        </button>

        <button data-tab="upcoming">
            📅 UPCOMING
        </button>

        <button data-tab="finished">
            ✅ FINISHED
        </button>

    </div>


    <!-- DATES -->

    <div class="datebar" id="dateBar"></div>


    <!-- REFRESH -->

    <button class="refresh" onclick="loadMatches()">
        🔄 Refresh Matches
    </button>


    <!-- STATUS -->

    <div id="status" class="status">
        Connecting to football-data.org...
    </div>


    <!-- MATCHES -->

    <div id="matches"></div>


    <!-- DEBUG -->

    <div id="debug" class="debug"></div>

</div>


<footer>
    M.Awaji LiveScores<br>
    Data provided by football-data.org
</footer>


<script>

/* =====================================================
   FOOTBALL-DATA.ORG SETTINGS
   ===================================================== */

/*
   IMPORTANT:
   Put your own football-data.org API token below.

   Do NOT send your token to anyone.
*/

const API_TOKEN =
"8963e3ad73f146e5ad4344562d2162a0";


const API_URL =
"https://api.football-data.org/v4";


/* =====================================================
   APP VARIABLES
   ===================================================== */

let selectedLeague = "PL";

let selectedTab = "live";

let selectedDate =
getLocalDate();


/* =====================================================
   ELEMENTS
   ===================================================== */

const matchesContainer =
document.getElementById("matches");

const statusBox =
document.getElementById("status");

const debugBox =
document.getElementById("debug");

const dateBar =
document.getElementById("dateBar");


/* =====================================================
   LOCAL DATE
   ===================================================== */

function getLocalDate() {

    const now = new Date();

    const year =
    now.getFullYear();

    const month =
    String(now.getMonth() + 1)
    .padStart(2, "0");

    const day =
    String(now.getDate())
    .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =====================================================
   FORMAT DATE
   ===================================================== */

function formatDate(date) {

    return date.toLocaleDateString(
        "en-US",
        {
            weekday: "short",
            month: "short",
            day: "numeric"
        }
    );
}


/* =====================================================
   CREATE DATE BUTTONS
   ===================================================== */

function createDates() {

    dateBar.innerHTML = "";

    const today = new Date();

    for (let i = -2; i <= 5; i++) {

        const date =
        new Date(today);

        date.setDate(
            today.getDate() + i
        );

        const dateString =
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(2, "0") +
        "-" +
        String(
            date.getDate()
        ).padStart(2, "0");


        const button =
        document.createElement("button");

        button.textContent =
        formatDate(date);


        if (dateString === selectedDate) {

            button.classList.add("active");

        }


        button.onclick = function() {

            selectedDate =
            dateString;

            createDates();

            loadMatches();

        };


        dateBar.appendChild(button);

    }
}


/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(endpoint) {

    const controller =
    new AbortController();

    const timeout =
    setTimeout(
        () => controller.abort(),
        15000
    );


    try {

        const response =
        await fetch(
            API_URL + endpoint,
            {
                method: "GET",

                mode: "cors",

                headers: {
                    "X-Auth-Token":
                    API_TOKEN,

                    "Accept":
                    "application/json"
                },

                signal:
                controller.signal
            }
        );


        clearTimeout(timeout);


        if (!response.ok) {

            let message = "";


            try {

                const errorData =
                await response.json();

                message =
                errorData.message || "";

            }

            catch (e) {}


            if (response.status === 401) {

                throw new Error(
                    "HTTP 401 - Invalid API token."
                );

            }


            if (response.status === 403) {

                throw new Error(
                    "HTTP 403 - Your API token does not have permission for this request."
                );

            }


            if (response.status === 429) {

                throw new Error(
                    "HTTP 429 - API rate limit exceeded."
                );

            }


            throw new Error(
                "HTTP " +
                response.status +
                " " +
                message
            );

        }


        return await response.json();

    }


    catch (error) {

        clearTimeout(timeout);


        if (
            error.name ===
            "AbortError"
        ) {

            throw new Error(
                "Request timed out. Check your internet connection."
            );

        }


        throw error;

    }

}


/* =====================================================
   TEST API
   ===================================================== */

async function testAPI() {

    if (
        !API_TOKEN ||
        API_TOKEN ===
        "PASTE_YOUR_FOOTBALL_DATA_TOKEN_HERE"
    ) {

        throw new Error(
            "API token has not been entered."
        );

    }


    /*
       IMPORTANT FIX:

       API_URL already contains /v4.

       Therefore this MUST be:

       /competitions/PL

       NOT:

       /v4/competitions/PL
    */

    return await apiRequest(
        "/competitions/PL"
    );

}


/* =====================================================
   LOAD MATCHES
   ===================================================== */

async function loadMatches() {

    matchesContainer.innerHTML =
    '<div class="loading">⚽ Loading matches...</div>';


    debugBox.style.display =
    "none";


    statusBox.className =
    "status";


    statusBox.textContent =
    "Connecting to football-data.org...";


    try {

        /*
           Test authentication first.
        */

        await testAPI();


        let endpoint =
        "/competitions/" +
        selectedLeague +
        "/matches";


        /*
           Get matches for selected date.
        */

        endpoint +=
        "?dateFrom=" +
        selectedDate +
        "&dateTo=" +
        selectedDate;


        const data =
        await apiRequest(endpoint);


        let matches =
        data.matches || [];


        /* =================================================
           FILTER LIVE
           ================================================= */

        if (selectedTab === "live") {

            matches =
            matches.filter(
                match =>
                [
                    "LIVE",
                    "IN_PLAY",
                    "PAUSED"
                ].includes(
                    match.status
                )
            );

        }


        /* =================================================
           FILTER UPCOMING
           ================================================= */

        else if (
            selectedTab === "upcoming"
        ) {

            matches =
            matches.filter(
                match =>
                [
                    "SCHEDULED",
                    "TIMED"
                ].includes(
                    match.status
                )
            );

        }


        /* =================================================
           FILTER FINISHED
           ================================================= */

        else if (
            selectedTab === "finished"
        ) {

            matches =
            matches.filter(
                match =>
                match.status ===
                "FINISHED"
            );

        }


        /*
           Sort matches by kickoff time.
        */

        matches.sort(
            (a, b) =>
            new Date(a.utcDate) -
            new Date(b.utcDate)
        );


        displayMatches(matches);


    }


    catch (error) {

        matchesContainer.innerHTML =
        "";


        statusBox.className =
        "status error";


        statusBox.textContent =
        "Unable to load matches";


        debugBox.style.display =
        "block";


        debugBox.innerHTML =
        "<strong>Error:</strong><br>" +
        escapeHTML(error.message) +
        "<br><br>" +

        "<strong>Possible causes:</strong><br>" +

        "• API token is invalid or missing<br>" +

        "• Your football-data.org plan does not allow this request<br>" +

        "• API rate limit reached<br>" +

        "• Internet connection problem<br>" +

        "• Browser/network blocked the API request";

    }

}


/* =====================================================
   DISPLAY MATCHES
   ===================================================== */

function displayMatches(matches) {

    matchesContainer.innerHTML = "";


    if (matches.length === 0) {

        statusBox.className =
        "status";


        statusBox.innerHTML =
        "No matches found for this selection.";


        if (selectedTab === "live") {

            statusBox.innerHTML +=
            "<br><small>" +
            "There may be no live matches at the selected time, or your API plan may provide delayed scores." +
            "</small>";

        }


        return;

    }


    statusBox.className =
    "status success";


    statusBox.textContent =
    matches.length +
    " match" +
    (
        matches.length === 1
        ? ""
        : "es"
    ) +
    " found";


    matches.forEach(
        match => {

            const card =
            document.createElement("div");

            card.className =
            "match";


            const home =
            match.homeTeam || {};


            const away =
            match.awayTeam || {};


            const score =
            match.score || {};


            const fullTime =
            score.fullTime || {};


            let homeScore =
            fullTime.home;


            let awayScore =
            fullTime.away;


            /*
               For live matches, football-data.org
               can provide the current score here.
            */

            if (
                homeScore === null ||
                homeScore === undefined
            ) {

                homeScore = "-";

            }


            if (
                awayScore === null ||
                awayScore === undefined
            ) {

                awayScore = "-";

            }


            /*
               Nigeria / West Africa time.
            */

            const matchTime =
            new Date(
                match.utcDate
            ).toLocaleTimeString(
                "en-NG",
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


            const isLive =
            [
                "LIVE",
                "IN_PLAY",
                "PAUSED"
            ].includes(
                match.status
            );


            let statusHTML = "";


            if (isLive) {

                statusHTML = `
                    <div class="live">
                        <span class="live-dot"></span>
                        LIVE
                    </div>
                `;

            }

            else {

                statusHTML = `
                    <div class="time">
                        ${escapeHTML(
                            match.status || ""
                        )}
                    </div>
                `;

            }


            card.innerHTML = `

                <div class="competition">

                    ${escapeHTML(
                        match.competition?.name ||
                        "Football"
                    )}

                </div>


                <div class="teams">


                    <div class="team">

                        ${
                            home.crest
                            ?
                            `<img
                                src="${escapeHTML(home.crest)}"
                                alt=""
                                onerror="this.style.display='none'"
                            >`
                            :
                            ""
                        }


                        ${escapeHTML(
                            home.name ||
                            "Home"
                        )}

                    </div>


                    <div>

                        <div class="score">

                            ${homeScore}
                            -
                            ${awayScore}

                        </div>


                        ${
                            isLive
                            ?
                            statusHTML
                            :
                            `
                            <div class="time">
                                ${matchTime}
                            </div>
                            `
                        }

                    </div>


                    <div class="team">

                        ${
                            away.crest
                            ?
                            `<img
                                src="${escapeHTML(away.crest)}"
                                alt=""
                                onerror="this.style.display='none'"
                            >`
                            :
                            ""
                        }


                        ${escapeHTML(
                            away.name ||
                            "Away"
                        )}

                    </div>

                </div>

            `;


            matchesContainer
            .appendChild(card);

        }
    );

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =====================================================
   LEAGUE BUTTONS
   ===================================================== */

document
.querySelectorAll(
    ".leagues button"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                document
                .querySelectorAll(
                    ".leagues button"
                )
                .forEach(
                    btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


                this.classList.add(
                    "active"
                );


                selectedLeague =
                this.dataset.league;


                loadMatches();

            }
        );

    }
);


/* =====================================================
   TAB BUTTONS
   ===================================================== */

document
.querySelectorAll(
    ".tabs button"
)
.forEach(
    button => {

        button.addEventListener(
            "click",
            function() {

                document
                .querySelectorAll(
                    ".tabs button"
                )
                .forEach(
                    btn =>
                    btn.classList.remove(
                        "active"
                    )
                );


                this.classList.add(
                    "active"
                );


                selectedTab =
                this.dataset.tab;


                loadMatches();

            }
        );

    }
);


/* =====================================================
   START APPLICATION
   ===================================================== */

createDates();

loadMatches();


/* =====================================================
   AUTO REFRESH
   ===================================================== */

/*
   Refresh every 60 seconds.
*/

setInterval(
    loadMatches,
    60000
);

</script>

</body>
</html>
