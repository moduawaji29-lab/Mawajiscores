<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>M.Awaji LiveScores</title>

<meta name="description"
content="M.Awaji LiveScores - Live football scores, fixtures and results">

<meta name="theme-color" content="#0b0d12">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#0b0d12;
    color:#fff;
}

header{
    background:linear-gradient(135deg,#071a12,#063c2a,#075c43);
    padding:18px 12px;
    text-align:center;
    position:sticky;
    top:0;
    z-index:100;
    box-shadow:0 3px 15px rgba(0,0,0,.4);
}

header h1{
    font-size:24px;
    margin-bottom:5px;
}

header p{
    font-size:12px;
    opacity:.8;
}

.container{
    max-width:700px;
    margin:auto;
    padding:10px;
}

.leagues{
    display:flex;
    gap:7px;
    overflow-x:auto;
    padding:8px 0;
}

.leagues button{
    flex:none;
    border:1px solid #285344;
    background:#121821;
    color:#fff;
    padding:9px 13px;
    border-radius:20px;
    font-size:12px;
}

.leagues button.active{
    background:#00a86b;
    border-color:#00a86b;
}

.tabs{
    display:flex;
    margin:8px 0;
    background:#121821;
    border-radius:10px;
    padding:4px;
}

.tabs button{
    flex:1;
    border:0;
    background:transparent;
    color:#aaa;
    padding:11px 5px;
    border-radius:8px;
    font-weight:bold;
}

.tabs button.active{
    background:#00a86b;
    color:#fff;
}

.datebar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    padding:8px 0;
}

.datebar button{
    min-width:90px;
    padding:8px;
    border-radius:8px;
    border:1px solid #29303a;
    background:#121821;
    color:#fff;
}

.datebar button.active{
    background:#075c43;
    border-color:#00a86b;
}

.status{
    background:#11161d;
    border-radius:10px;
    padding:10px;
    margin:8px 0;
    font-size:12px;
    text-align:center;
}

.error{
    color:#ff6b6b;
}

.success{
    color:#42e695;
}

.loading{
    text-align:center;
    padding:25px;
    color:#aaa;
}

.match{
    background:#121821;
    border:1px solid #202833;
    border-radius:12px;
    margin:10px 0;
    padding:12px;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.competition{
    font-size:11px;
    color:#00d084;
    margin-bottom:10px;
}

.teams{
    display:grid;
    grid-template-columns:1fr 70px 1fr;
    align-items:center;
    gap:5px;
}

.team{
    text-align:center;
    font-size:13px;
}

.team img{
    width:38px;
    height:38px;
    object-fit:contain;
    display:block;
    margin:0 auto 6px;
}

.score{
    text-align:center;
    font-size:21px;
    font-weight:bold;
}

.time{
    text-align:center;
    font-size:11px;
    color:#aaa;
    margin-top:5px;
}

.live{
    color:#ff4545;
    font-size:11px;
    font-weight:bold;
    margin-top:5px;
}

.empty{
    text-align:center;
    padding:35px 15px;
    color:#999;
}

.refresh{
    width:100%;
    border:0;
    padding:12px;
    margin:10px 0;
    border-radius:9px;
    background:#00a86b;
    color:#fff;
    font-weight:bold;
}

footer{
    text-align:center;
    padding:25px 10px;
    color:#777;
    font-size:11px;
}

.debug{
    background:#171c23;
    border:1px solid #333;
    padding:10px;
    border-radius:8px;
    margin-top:10px;
    font-size:11px;
    word-break:break-word;
    display:none;
}
</style>
</head>

<body>

<header>
    <h1>⚽ M.Awaji LiveScores</h1>
    <p>Football Scores • Fixtures • Results</p>
</header>

<div class="container">

    <div class="leagues">

        <button class="active"
        data-league="PL">Premier League</button>

        <button
        data-league="PD">La Liga</button>

        <button
        data-league="SA">Serie A</button>

        <button
        data-league="BL1">Bundesliga</button>

        <button
        data-league="FL1">Ligue 1</button>

        <button
        data-league="CL">Champions League</button>

    </div>

    <div class="tabs">

        <button class="active"
        data-tab="live">
        🔴 LIVE
        </button>

        <button
        data-tab="upcoming">
        📅 UPCOMING
        </button>

        <button
        data-tab="finished">
        ✅ FINISHED
        </button>

    </div>

    <div class="datebar" id="dateBar"></div>

    <button class="refresh"
    onclick="loadMatches()">
        🔄 Refresh Matches
    </button>

    <div id="status" class="status">
        Connecting to football-data.org...
    </div>

    <div id="matches"></div>

    <div id="debug" class="debug"></div>

</div>

<footer>
    M.Awaji LiveScores<br>
    Data provided by football-data.org
</footer>

<script>

/* =====================================================
   FOOTBALL-DATA.ORG SETTINGS
   ===================================================== */

const API_TOKEN =
"8963e3ad73f146e5ad4344562d2162a0";

const API_URL =
"https://api.football-data.org/v4";


/* =====================================================
   APP VARIABLES
   ===================================================== */

let selectedLeague = "PL";
let selectedTab = "live";

let selectedDate =
new Date().toISOString().split("T")[0];


/* =====================================================
   ELEMENTS
   ===================================================== */

const matchesContainer =
document.getElementById("matches");

const statusBox =
document.getElementById("status");

const debugBox =
document.getElementById("debug");

const dateBar =
document.getElementById("dateBar");


/* =====================================================
   DATE HELPERS
   ===================================================== */

function formatDate(date){

    return date.toLocaleDateString(
        "en-US",
        {
            weekday:"short",
            month:"short",
            day:"numeric"
        }
    );
}


function createDates(){

    dateBar.innerHTML = "";

    const today = new Date();

    for(let i=-2;i<=5;i++){

        const date = new Date(today);

        date.setDate(
            today.getDate()+i
        );

        const dateString =
        date.toISOString().split("T")[0];

        const button =
        document.createElement("button");

        button.textContent =
        formatDate(date);

        if(dateString === selectedDate){

            button.classList.add("active");

        }

        button.onclick = function(){

            selectedDate =
            dateString;

            createDates();

            loadMatches();

        };

        dateBar.appendChild(button);

    }
}


/* =====================================================
   API REQUEST
   ===================================================== */

async function apiRequest(endpoint){

    const controller =
    new AbortController();

    const timeout =
    setTimeout(
        () => controller.abort(),
        15000
    );

    try{

        const response =
        await fetch(
            API_URL + endpoint,
            {
                method:"GET",

                mode:"cors",

                headers:{
                    "X-Auth-Token":
                    API_TOKEN,

                    "Accept":
                    "application/json"
                },

                signal:
                controller.signal
            }
        );

        clearTimeout(timeout);


        if(!response.ok){

            let message = "";

            try{

                const errorData =
                await response.json();

                message =
                errorData.message || "";

            }catch(e){}


            if(response.status === 401){

                throw new Error(
                    "HTTP 401 - Invalid API token."
                );

            }

            if(response.status === 403){

                throw new Error(
                    "HTTP 403 - Your API token does not have permission for this request."
                );

            }

            if(response.status === 429){

                throw new Error(
                    "HTTP 429 - API rate limit exceeded."
                );

            }

            throw new Error(
                "HTTP " +
                response.status +
                " " +
                message
            );

        }

        return await response.json();

    }catch(error){

        clearTimeout(timeout);

        if(error.name === "AbortError"){

            throw new Error(
                "Request timed out. Check your internet connection."
            );

        }

        throw error;

    }

}


/* =====================================================
   TEST API CONNECTION
   ===================================================== */

async function testAPI(){

    if(
        !API_TOKEN ||
        API_TOKEN ===
        "PASTE_YOUR_FOOTBALL_DATA_TOKEN_HERE"
    ){

        throw new Error(
            "API token has not been entered."
        );

    }

    return await apiRequest(
        "/v4/competitions/PL"
    );

}


/* =====================================================
   LOAD MATCHES
   ===================================================== */

async function loadMatches(){

    matchesContainer.innerHTML =
    '<div class="loading">Loading matches...</div>';

    debugBox.style.display =
    "none";

    statusBox.className =
    "status";

    statusBox.textContent =
    "Connecting to football-data.org...";

    try{

        /* First test authentication */

        await testAPI();


        let endpoint =
        "/competitions/" +
        selectedLeague +
        "/matches";


        /*
         LIVE:
         Request today's matches.
        */

        if(selectedTab === "live"){

            endpoint +=
            "?dateFrom=" +
            selectedDate +
            "&dateTo=" +
            selectedDate;

        }


        /*
         UPCOMING
        */

        else if(selectedTab === "upcoming"){

            endpoint +=
            "?dateFrom=" +
            selectedDate +
            "&dateTo=" +
            selectedDate;

        }


        /*
         FINISHED
        */

        else if(selectedTab === "finished"){

            endpoint +=
            "?dateFrom=" +
            selectedDate +
            "&dateTo=" +
            selectedDate;

        }


        const data =
        await apiRequest(endpoint);


        let matches =
        data.matches || [];


        /* =================================================
           FILTER STATUS
           ================================================= */

        if(selectedTab === "live"){

            matches =
            matches.filter(
                match =>
                [
                    "LIVE",
                    "IN_PLAY",
                    "PAUSED"
                ].includes(match.status)
            );

        }


        else if(selectedTab === "upcoming"){

            matches =
            matches.filter(
                match =>
                [
                    "SCHEDULED",
                    "TIMED"
                ].includes(match.status)
            );

        }


        else if(selectedTab === "finished"){

            matches =
            matches.filter(
                match =>
                match.status ===
                "FINISHED"
            );

        }


        displayMatches(matches);


    }catch(error){

        matchesContainer.innerHTML = "";

        statusBox.className =
        "status error";

        statusBox.textContent =
        "Unable to load matches";


        debugBox.style.display =
        "block";

        debugBox.innerHTML =
        "<strong>Error:</strong><br>" +
        escapeHTML(error.message) +
        "<br><br>" +

        "<strong>Possible causes:</strong><br>" +

        "• API token is invalid or still a placeholder<br>" +

        "• Your football-data.org plan does not allow the requested data<br>" +

        "• Browser/network connection blocked the request<br>" +

        "• API rate limit reached<br><br>" +

        "If the message says 'Failed to fetch', the browser did not receive a normal HTTP response.";

    }

}


/* =====================================================
   DISPLAY MATCHES
   ===================================================== */

function displayMatches(matches){

    matchesContainer.innerHTML = "";


    if(matches.length === 0){

        statusBox.className =
        "status";

        statusBox.innerHTML =
        "No matches found for this selection.";


        if(selectedTab === "live"){

            statusBox.innerHTML +=
            "<br><small>" +
            "Note: the football-data.org free plan provides delayed scores, so true live matches may not appear." +
            "</small>";

        }

        return;

    }


    statusBox.className =
    "status success";

    statusBox.textContent =
    matches.length +
    " match" +
    (matches.length === 1 ? "" : "es") +
    " found";


    matches.forEach(match => {

        const card =
        document.createElement("div");

        card.className =
        "match";


        const home =
        match.homeTeam || {};

        const away =
        match.awayTeam || {};

        const score =
        match.score || {};

        const fullTime =
        score.fullTime || {};


        let homeScore =
        fullTime.home;

        let awayScore =
        fullTime.away;


        if(homeScore === null ||
           homeScore === undefined){

            homeScore = "-";

        }

        if(awayScore === null ||
           awayScore === undefined){

            awayScore = "-";

        }


        const matchTime =
        new Date(
            match.utcDate
        ).toLocaleTimeString(
            "en-NG",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );


        let statusText =
        match.status || "";


        if(
            [
                "LIVE",
                "IN_PLAY",
                "PAUSED"
            ].includes(match.status)
        ){

            statusText =
            "🔴 LIVE";

        }


        card.innerHTML = `

            <div class="competition">

                ${escapeHTML(
                    match.competition?.name ||
                    "Football"
                )}

            </div>


            <div class="teams">

                <div class="team">

                    ${
                        home.crest
                        ?
                        `<img
                        src="${home.crest}"
                        alt=""
                        onerror="this.style.display='none'"
                        >`
                        :
                        ""
                    }

                    ${escapeHTML(
                        home.name ||
                        "Home"
                    )}

                </div>


                <div>

                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div class="time">

                        ${matchTime}

                    </div>


                    ${
                        statusText
                        ?
                        `<div class="live">
                        ${escapeHTML(statusText)}
                        </div>`
                        :
                        ""
                    }

                </div>


                <div class="team">

                    ${
                        away.crest
                        ?
                        `<img
                        src="${away.crest}"
                        alt=""
                        onerror="this.style.display='none'"
                        >`
                        :
                        ""
                    }

                    ${escapeHTML(
                        away.name ||
                        "Away"
                    )}

                </div>

            </div>

        `;


        matchesContainer.appendChild(card);

    });

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   LEAGUE BUTTONS
   ===================================================== */

document
.querySelectorAll(".leagues button")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".leagues button")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            selectedLeague =
            this.dataset.league;

            loadMatches();

        }
    );

});


/* =====================================================
   TAB BUTTONS
   ===================================================== */

document
.querySelectorAll(".tabs button")
.forEach(button => {

    button.addEventListener(
        "click",
        function(){

            document
            .querySelectorAll(".tabs button")
            .forEach(btn =>
                btn.classList.remove("active")
            );

            this.classList.add("active");

            selectedTab =
            this.dataset.tab;

            loadMatches();

        }
    );

});


/* =====================================================
   START APP
   ===================================================== */

createDates();

loadMatches();


/* =====================================================
   AUTO REFRESH
   ===================================================== */

setInterval(
    loadMatches,
    60000
);

</script>

</body>
</html>
