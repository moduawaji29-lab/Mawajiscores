        <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

.primary-btn {

<body>

<!-- =========================================================
     API SETUP
========================================================= -->

<div id="setupScreen" class="setup-box hidden">
    <h2>⚽ M Awaji LiveScores</h2>

        Enter your API-Football API key to connect the app to real
        football match data.
    </p>

    <input
        type="password"
        id="apiKeyInput"
        placeholder="Enter API-Football API key"
        autocomplete="off"
        value="71548bfb1ba52c55ebc278cb4c8b8780"
    >

    <button class="primary-btn" onclick="saveApiKey()">
        Connect API
    </button>

<!-- =========================================================
     MAIN APP
========================================================= -->

<div id="mainApp" class="hidden">

    <header class="header">
        <div class="header-row">

            <div class="logo-title">
                <div class="logo-ball">⚽</div>

                <div>
                    <h1>M Awaji LiveScores</h1>
                    <small>Real football scores & statistics</small>
                </div>
            </div>

            <button class="refresh-btn" onclick="loadMatches(true)">

            </button>

        </div>
    </header>


    <main class="main-content">

        <div class="search-box">

                type="text"
                id="searchInput"
                placeholder="Search team or league..."
                oninput="renderMatches()"
            >
        </div>


        <div class="league-filter" id="leagueFilter">

            <button class="active" onclick="selectLeague('all', this)">

            </button>

             style="color:#718096;font-size:11px;margin-bottom:10px;">
        </div>

    <nav class="bottom-nav">

        <button id="navLive"
                class="active"
                onclick="changeTab('live', this)">
            <span>🔴</span>
            Live

        <button id="navUpcoming"
                onclick="changeTab('upcoming', this)">
            <span>🕐</span>
            Upcoming
        </button>

        <button id="navResults"
                onclick="changeTab('results', this)">
            <span>✅</span>
            Results
        </button>

                onclick="changeTab('favorites', this)">
            <span>⭐</span>
            Favorites

</div>


<!-- =========================================================
     MATCH CENTRE
========================================================= -->

<section id="matchCentre" class="match-centre hidden">

    <header class="mc-header">

        <div class="mc-top">

            <button class="back-btn"
                    onclick="closeMatchCentre()">
                ←
            </button>

            <h2>Match Centre</h2>

        </div>

    </header>


    <div id="matchScoreHeader" class="mc-score"></div>


    <div class="mc-tabs">

        <button
            id="mcTabEvents"
            class="active"
            onclick="changeMatchCentreTab('events', this)">
            Events
        </button>

        <button
            id="mcTabStats"
            onclick="changeMatchCentreTab('stats', this)">
            Statistics
        </button>

        <button
            id="mcTabLineups"
            onclick="changeMatchCentreTab('lineups', this)">
            Lineups
        </button>

        <button
            id="mcTabPlayers"
            onclick="changeMatchCentreTab('players', this)">
            Players
        </button>

    </div>


    <div id="matchCentreBody" class="mc-body">

        <div class="loading">
            <div class="spinner"></div>
            Loading real match data...
        </div>

    </div>

</section>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL = "https://v3.football.api-sports.io";

const API_KEY_STORAGE = "footballApiKey";

const FAVORITES_STORAGE = "footballFavorites";


/* =========================================================
   GLOBAL STATE
========================================================= */

let apiKey = localStorage.getItem(API_KEY_STORAGE) || "71548bfb1ba52c55ebc278cb4c8b8780";

let matchesData = [];

let selectedLeague = "all";

let selectedTab = "live";

let currentMatch = null;

let currentMatchCentreTab = "events";

let matchCentreRefreshTimer = null;


/* =========================================================
   LEAGUES
========================================================= */

const LEAGUES = {
    39: "Premier League",
    140: "La Liga",
    135: "Serie A",
    78: "Bundesliga",
    61: "Ligue 1",
    2: "Champions League"
};


/* =========================================================
   START APP
========================================================= */

document.addEventListener("DOMContentLoaded", () => {

    if (apiKey) {

        showMainApp();

        loadMatches();

    } else {

        document
            .getElementById("setupScreen")
            .classList.remove("hidden");

    }

});


/* =========================================================
   API KEY
========================================================= */

function saveApiKey() {

    const input =
        document.getElementById("apiKeyInput");

    const key =
        input.value.trim();

    if (!key) {

        alert("Please enter your API-Football API key.");

        return;
    }

    localStorage.setItem(
        API_KEY_STORAGE,
        key
    );

    apiKey = key;

    showMainApp();

    loadMatches();

}


function showMainApp() {

    document
        .getElementById("setupScreen")
        .classList.add("hidden");

    document
        .getElementById("mainApp")
        .classList.remove("hidden");

}


/* =========================================================
   API REQUEST
========================================================= */

async function apiFetch(endpoint) {

    if (!apiKey) {

        throw new Error(
            "API key is missing."
        );

    }

    const response = await fetch(
        API_URL + endpoint,
        {
            method: "GET",

            headers: {
                "x-apisports-key": apiKey,
                "Accept": "application/json"
            }
        }
    );


    if (!response.ok) {

        throw new Error(
            `API request failed: HTTP ${response.status}`
        );

    }


    const data = await response.json();


    if (
        data.errors &&
        Object.keys(data.errors).length > 0
    ) {

        const errors =
            Object.values(data.errors).join(", ");

        throw new Error(errors);

    }


    return data;

}


/* =========================================================
   DATE
========================================================= */

function getNigeriaDate() {

    const formatter =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Africa/Lagos",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        );

    return formatter.format(
        new Date()
    );

}


/* =========================================================
   LOAD MATCHES
========================================================= */

async function loadMatches(showMessage = false) {

    const container =
        document.getElementById(
            "matchesContainer"
        );


    if (showMessage) {

        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Updating scores...
            </div>
        `;

    } else if (!matchesData.length) {

        container.innerHTML = `
            <div class="loading">
                <div class="spinner"></div>
                Loading real football matches...
            </div>
        `;

    }


    try {

        const today =
            getNigeriaDate();


        const data =
            await apiFetch(
                `/fixtures?date=${today}&timezone=Africa/Lagos`
            );


        matchesData =
            Array.isArray(data.response)
                ? data.response
                : [];


        document.getElementById(
            "lastUpdated"
        ).textContent =
            "Last updated: " +
            new Date().toLocaleTimeString();


        renderMatches();


    } catch (error) {

        console.error(error);

        container.innerHTML = `
            <div class="error-box">
                <strong>Unable to load matches.</strong>
                <br><br>
                ${escapeHTML(error.message)}
                <br><br>
                Check your API key and internet connection.
            </div>
        `;

    }

}


/* =========================================================
   TABS
========================================================= */

function changeTab(tab, button) {

    selectedTab = tab;


    document
        .querySelectorAll(".bottom-nav button")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    if (button) {

        button.classList.add("active");

    }


    renderMatches();

}


/* =========================================================
   LEAGUE
========================================================= */

function selectLeague(league, button) {

    selectedLeague = league;


    document
        .querySelectorAll("#leagueFilter button")
        .forEach(btn => {
            btn.classList.remove("active");
        });


    button.classList.add("active");


    renderMatches();

}


/* =========================================================
   MATCH STATUS HELPERS
========================================================= */

function isLive(match) {

    const status =
        match.fixture?.status?.short;

    return [
        "1H",
        "HT",
        "2H",
        "ET",
        "BT",
        "P",
        "LIVE"
    ].includes(status);

}


function isFinished(match) {

    const status =
        match.fixture?.status?.short;

    return [
        "FT",
        "AET",
        "PEN"
    ].includes(status);

}


function isUpcoming(match) {

    return !isLive(match) &&
           !isFinished(match);

}


/* =========================================================
   RENDER MATCHES
========================================================= */

function renderMatches() {

    const container =
        document.getElementById(
            "matchesContainer"
        );


    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    let filtered =
        [...matchesData];


    /* League */

    if (selectedLeague !== "all") {

        filtered =
            filtered.filter(
                match =>
                    Number(match.league?.id) ===
                    Number(selectedLeague)
            );

    }


    /* Tab */

    if (selectedTab === "live") {

        filtered =
            filtered.filter(
                match => isLive(match)
            );

    }

    else if (selectedTab === "upcoming") {

        filtered =
            filtered.filter(
                match => isUpcoming(match)
            );

    }

    else if (selectedTab === "results") {

        filtered =
            filtered.filter(
                match => isFinished(match)
            );

    }

    else if (selectedTab === "favorites") {

        const favorites =
            getFavorites();

        filtered =
            filtered.filter(
                match =>
                    favorites.includes(
                        String(match.fixture?.id)
                    )
            );

    }


    /* Search */

    if (search) {

        filtered =
            filtered.filter(match => {

                const home =
                    match.teams?.home?.name || "";

                const away =
                    match.teams?.away?.name || "";

                const league =
                    match.league?.name || "";


                return (
                    home.toLowerCase().includes(search) ||
                    away.toLowerCase().includes(search) ||
                    league.toLowerCase().includes(search)
                );

            });

    }


    /* Sort */

    filtered.sort(
        (a, b) =>
            (a.fixture?.timestamp || 0) -
            (b.fixture?.timestamp || 0)
    );


    if (!filtered.length) {

        container.innerHTML = `
            <div class="empty">
                No matches found.
            </div>
        `;

        return;

    }


    container.innerHTML =
        filtered
            .map(createMatchCard)
            .join("");

}


/* =========================================================
   MATCH CARD
========================================================= */

function createMatchCard(match) {

    const fixtureId =
        match.fixture?.id;


    const home =
        match.teams?.home || {};

    const away =
        match.teams?.away || {};


    const scoreHome =
        match.goals?.home;

    const scoreAway =
        match.goals?.away;


    const status =
        match.fixture?.status || {};


    const favorite =
        getFavorites()
            .includes(String(fixtureId));


    let statusText =
        status.short || "";


    if (isLive(match)) {

        statusText =
            status.elapsed
                ? `${status.short} ${status.elapsed}'`
                : "LIVE";

    }

    else if (isFinished(match)) {

        statusText =
            status.short || "FT";

    }

    else {

        const date =
            new Date(match.fixture.date);

        statusText =
            date.toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );

    }


    const venue =
        match.fixture?.venue?.name || "";


    return `

        <div class="match-card"
             onclick="openMatchCentre(${fixtureId})">

            <div class="match-card-top">

                <span>
                    ${escapeHTML(
                        match.league?.name || "Football"
                    )}
                </span>


                <button
                    class="favorite-btn ${favorite ? "active" : ""}"
                    onclick="toggleFavorite(event, '${fixtureId}')">

                    ${favorite ? "★" : "☆"}

                </button>

            </div>


            <div class="teams">

                <div class="team">

                    <img
                        src="${escapeHTML(home.logo || "")}"
                        alt=""
                        onerror="this.style.display='none'"
                    >

                    <div class="team-name">
                        ${escapeHTML(home.name || "Home")}
                    </div>

                </div>


                <div class="score">

                    <div class="score-main">

                        ${
                            scoreHome !== null &&
                            scoreHome !== undefined
                                ? `${scoreHome} - ${scoreAway}`
                                : "vs"
                        }

                    </div>

                    <div class="status ${
                        isLive(match)
                            ? "live-label"
                            : ""
                    }">

                        ${escapeHTML(statusText)}

                    </div>

                </div>


                <div class="team">

                    <img
                        src="${escapeHTML(away.logo || "")}"
                        alt=""
                        onerror="this.style.display='none'"
                    >

                    <div class="team-name">
                        ${escapeHTML(away.name || "Away")}
                    </div>

                </div>

            </div>


            ${
                venue
                    ? `
                        <div class="match-venue">
                            📍 ${escapeHTML(venue)}
                        </div>
                      `
                    : ""
            }

        </div>
    `;

}


/* =========================================================
   FAVORITES
========================================================= */

function getFavorites() {

    try {

        return JSON.parse(
            localStorage.getItem(
                FAVORITES_STORAGE
            ) || "[]"
        );

    } catch {

        return [];

    }

}


function toggleFavorite(event, fixtureId) {

    event.stopPropagation();


    let favorites =
        getFavorites();


    fixtureId =
        String(fixtureId);


    if (favorites.includes(fixtureId)) {

        favorites =
            favorites.filter(
                id => id !== fixtureId
            );

    } else {

        favorites.push(fixtureId);

    }


    localStorage.setItem(
        FAVORITES_STORAGE,
        JSON.stringify(favorites)
    );


    renderMatches();

}


/* =========================================================
   OPEN MATCH CENTRE
========================================================= */

async function openMatchCentre(fixtureId) {

    const match =
        matchesData.find(
            item =>
                Number(item.fixture?.id) ===
                Number(fixtureId)
        );


    if (!match) {

        alert("Match information could not be found.");

        return;

    }


    currentMatch = match;


    document
        .getElementById("mainApp")
        .classList.add("hidden");


    document
        .getElementById("matchCentre")
        .classList.remove("hidden");


    currentMatchCentreTab = "events";


    resetMatchCentreTabs();


    renderMatchScoreHeader();


    document.getElementById(
        "matchCentreBody"
    ).innerHTML = `
        <div class="loading">
            <div class="spinner"></div>
            Loading real match data...
        </div>
    `;


    await loadMatchDetails();


    startMatchCentreAutoRefresh();

}


/* =========================================================
   CLOSE MATCH CENTRE
========================================================= */

function closeMatchCentre() {

    stopMatchCentreAutoRefresh();


    document
        .getElementById("matchCentre")
        .classList.add("hidden");

        .getElementById("mainApp")
        .classList.remove("hidden");

}

/* =========================================================
   MATCH DETAIL LOADING
========================================================= */

async function loadMatchDetails() {

    if (!currentMatch) return;


    const fixtureId =
        currentMatch.fixture.id;


    try {

        /*
         * API-Football can return events, lineups,
         * statistics and player statistics with the
         * fixture detail request.
         */

        const data =
            await apiFetch(
                `/fixtures?id=${fixtureId}`
            );


        const detailedMatch =
            data.response?.[0];


        if (detailedMatch) {

            currentMatch =
                mergeFixtureData(
                    currentMatch,
                    detailedMatch
                );

        }


        /*
         * Some competitions/matches may not return
         * every block. Fetch missing blocks directly.
         */

        await fetchMissingMatchData();


        renderMatchScoreHeader();


        renderCurrentMatchCentreTab();


    } catch (error) {

        console.error(error);


        document.getElementById(
            "matchCentreBody"
        ).innerHTML = `

            <div class="error-box">

                <strong>
                    Could not load match details.
                </strong>

                <br><br>

                ${escapeHTML(error.message)}

            </div>
        `;

    }

}


/* =========================================================
   MERGE FIXTURE DATA
========================================================= */

function mergeFixtureData(base, detailed) {

    return {
        ...base,
        ...detailed,

        fixture: {
            ...base.fixture,
            ...detailed.fixture
        },

        league: {
            ...base.league,
            ...detailed.league
        },

        teams: {
            ...base.teams,
            ...detailed.teams
        },

        goals: {
            ...base.goals,
            ...detailed.goals
        }
    };

}


/* =========================================================
   FETCH MISSING BLOCKS
========================================================= */

async function fetchMissingMatchData() {

    const fixtureId =
        currentMatch.fixture.id;


    const requests = [];


    if (!Array.isArray(currentMatch.events)) {

        requests.push({
            type: "events",
            endpoint:
                `/fixtures/events?fixture=${fixtureId}`
        });

    }


    if (!Array.isArray(currentMatch.statistics)) {

        requests.push({
            type: "statistics",
            endpoint:
                `/fixtures/statistics?fixture=${fixtureId}`
        });

    }


    if (!Array.isArray(currentMatch.lineups)) {

        requests.push({
            type: "lineups",
            endpoint:
                `/fixtures/lineups?fixture=${fixtureId}`
        });

    }


    if (!Array.isArray(currentMatch.players)) {

        requests.push({
            type: "players",
            endpoint:
                `/fixtures/players?fixture=${fixtureId}`
        });

    }


    if (!requests.length) return;


    const results =
        await Promise.allSettled(
            requests.map(
                request =>
                    apiFetch(request.endpoint)
            )
        );


    results.forEach(
        (result, index) => {

            if (
                result.status !== "fulfilled"
            ) {
                return;
            }


            const type =
                requests[index].type;


            const response =
                result.value.response;


            if (type === "events") {

                currentMatch.events =
                    Array.isArray(response)
                        ? response
                        : [];

            }


            if (type === "statistics") {

                currentMatch.statistics =
                    Array.isArray(response)
                        ? response
                        : [];

            }


            if (type === "lineups") {

                currentMatch.lineups =
                    Array.isArray(response)
                        ? response
                        : [];

            }


            if (type === "players") {

                currentMatch.players =
                    Array.isArray(response)
                        ? response
                        : [];

            }

        }
    );

}

/* =========================================================
   EVENTS
========================================================= */

function renderEvents() {

    const body =
        document.getElementById(
            "matchCentreBody"
        );


    const events =
        Array.isArray(currentMatch.events)
            ? currentMatch.events
            : [];


    if (!events.length) {

        body.innerHTML = `
            <div class="empty">
                Match events are not available yet.
            </div>
        `;

        return;

    }


    const homeId =
        currentMatch.teams?.home?.id;


    const sortedEvents =
        [...events].sort(
            (a, b) => {

                const minuteA =
                    Number(a.time?.elapsed || 0);

                const minuteB =
                    Number(b.time?.elapsed || 0);

                return minuteA - minuteB;

            }
        );


    body.innerHTML = `

        <div class="detail-card">

            <h3 class="mc-section-title">
                Match Events
            </h3>


            ${sortedEvents.map(event => {

                const isHome =
                    Number(event.team?.id) ===
                    Number(homeId);


                const minute =
                    event.time?.elapsed ??
                    "";


                const extra =
                    event.time?.extra;


                const minuteText =
                    extra !== null &&
                    extra !== undefined
                        ? `${minute}+${extra}'`
                        : `${minute}'`;


                const type =
                    String(
                        event.type || ""
                    ).toLowerCase();


                let icon = "•";

                let playerName =
                    event.player?.name ||
                    "Unknown player";

                let detail =
                    event.detail || "";


                if (type === "goal") {

                    if (
                        String(event.detail || "")
                            .toLowerCase()
                            .includes("own")
                    ) {
                        icon = "⚽";
                    }

                    else if (
                        String(event.detail || "")
                            .toLowerCase()
                            .includes("missed")
                    ) {
                        icon = "❌";
                    }

                    else {

                        icon = "⚽";

                    }


                    if (
                        event.assist?.name
                    ) {

                        detail +=
                            ` • Assist: ${event.assist.name}`;

                    }

                }

                else if (type === "card") {

                    const card =
                        String(
                            event.detail || ""
                        ).toLowerCase();


                    if (
                        card.includes("red")
                    ) {

                        icon = "🟥";

                    }

                    else {

                        icon = "🟨";

                    }

                }

                else if (
                    type === "subst"
                ) {

                    icon = "🔄";


                    const outgoing =
                        event.player?.name ||
                        "Unknown";


                    const incoming =
                        event.assist?.name ||
                        "Unknown";


                    playerName =
                        `${incoming} IN`;


                    detail =
                        `${outgoing} OUT`;

                }


                return `

                    <div class="event-row">

                        <div class="event-minute">
                            ${escapeHTML(minuteText)}
                        </div>


                        <div class="
                            event-info
                            ${
                                isHome
                                    ? "event-home"
                                    : "event-away"
                            }
                        ">

                            <div class="event-player">
                                ${escapeHTML(playerName)}
                            </div>

                            <div class="event-detail">
                                ${escapeHTML(detail)}
                            </div>

                        </div>


                        <div class="event-icon">
                            ${icon}
                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================================================
   STATISTICS
========================================================= */

function renderStatistics() {

    const body =
        document.getElementById(
            "matchCentreBody"
        );


    const statistics =
        Array.isArray(
            currentMatch.statistics
        )
            ? currentMatch.statistics
            : [];


    if (statistics.length < 1) {

        body.innerHTML = `
            <div class="empty">
                Match statistics are not available yet.
            </div>
        `;

        return;

    }


    const homeStats =
        statistics.find(
            item =>
                Number(item.team?.id) ===
                Number(
                    currentMatch.teams?.home?.id
                )
        );


    const awayStats =
        statistics.find(
            item =>
                Number(item.team?.id) ===
                Number(
                    currentMatch.teams?.away?.id
                )
        );


    const homeMap =
        buildStatisticsMap(
            homeStats?.statistics
        );


    const awayMap =
        buildStatisticsMap(
            awayStats?.statistics
        );


    /*
     * Use statistics actually returned by API-Football.
     * No fake values are inserted.
     */

    const statNames =
        collectStatNames(
            homeStats?.statistics,
            awayStats?.statistics
        );


    if (!statNames.length) {

        body.innerHTML = `
            <div class="empty">
                No match statistics have been returned by
                the API for this match.
            </div>
        `;

        return;

    }


    body.innerHTML = `

        <div class="detail-card">

            <h3 class="mc-section-title">
                Real Match Statistics
            </h3>


            <div class="stat-row"
                 style="border-bottom:0;color:#9aa7ba;">

                <div>
                    ${escapeHTML(
                        currentMatch.teams?.home?.name || "Home"
                    )}
                </div>

                <div class="stat-name">
                    STAT
                </div>

                <div style="text-align:right;">
                    ${escapeHTML(
                        currentMatch.teams?.away?.name || "Away"
                    )}
                </div>

            </div>


            ${statNames.map(statName => {

                const home =
                    homeMap[statName];

                const away =
                    awayMap[statName];


                const homeValue =
                    normalizeStatValue(
                        home?.value
                    );


                const awayValue =
                    normalizeStatValue(
                        away?.value
                    );


                return `

                    <div class="stat-row">

                        <div class="stat-value">
                            ${escapeHTML(homeValue)}
                        </div>


                        <div>

                            <div class="stat-name">
                                ${escapeHTML(statName)}
                            </div>


                            ${
                                createStatBar(
                                    home?.value,
                                    away?.value
                                )
                            }

                        </div>


                        <div class="stat-value right">
                            ${escapeHTML(awayValue)}
                        </div>

                    </div>

                `;

            }).join("")}

        </div>

    `;

}


/* =========================================================
   STATISTICS HELPERS
========================================================= */

function buildStatisticsMap(stats) {

    const map = {};


    if (!Array.isArray(stats)) {

        return map;

    }


    stats.forEach(stat => {

        if (stat?.type) {

            map[stat.type] =
                stat;

        }

    });


    return map;

}


function collectStatNames(homeStats, awayStats) {

    const names =
        new Set();


    [
        ...(Array.isArray(homeStats)
            ? homeStats
            : []),

        ...(Array.isArray(awayStats)
            ? awayStats
            : [])
    ].forEach(stat => {

        if (stat?.type) {

            names.add(stat.type);

        }

    });


    const preferredOrder = [

        "Ball Possession",

        "Total Shots",

        "Shots on Goal",

        "Shots on Target",

        "Shots off Goal",

        "Shots off Target",

        "Blocked Shots",

        "Shots insidebox",

        "Shots inside Box",

        "Shots outsidebox",

        "Shots outside Box",

        "Corner Kicks",

        "Fouls",

        "Offsides",

        "Goalkeeper Saves",

        "Total passes",

        "Passes",

        "Passes accurate",

        "Passes %",
        "Yellow Cards",

        "Red Cards",

        "Free Kicks",

        "Throw-ins",

        "Crosses",

        "Tackles",

        "Interceptions",

        "Duels Won"

    ];


    const ordered = [];


    preferredOrder.forEach(name => {

        if (names.has(name)) {

            ordered.push(name);

            names.delete(name);

        }

    });


    return [
        ...ordered,
        ...Array.from(names)
    ];

}


function normalizeStatValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {

        return "—";

    }


    return String(value);

}


function createStatBar(homeValue, awayValue) {

    const homeNumber =
        parsePercentageOrNumber(
            homeValue
        );


    const awayNumber =
        parsePercentageOrNumber(
            awayValue
        );


    if (
        homeNumber === null ||
        awayNumber === null ||
        homeNumber < 0 ||
        awayNumber < 0 ||
        homeNumber + awayNumber === 0
    ) {

        return "";

    }


    const total =
        homeNumber +
        awayNumber;


    const homeWidth =
        Math.max(
            0,
            Math.min(
                100,
                (homeNumber / total) * 100
            )
        );


    const awayWidth =
        100 - homeWidth;


    return `

        <div class="stat-bar">

            <div
                class="stat-bar-left"
                style="width:${homeWidth}%">
            </div>

            <div
                class="stat-bar-right"
                style="width:${awayWidth}%">
            </div>

        </div>

    `;

}


function parsePercentageOrNumber(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return null;

    }


    const number =
        parseFloat(
            String(value).replace("%", "")
        );


    return Number.isFinite(number)
        ? number
        : null;

}

            ? currentMatch.players
            : [];


    if (!players.length) {

        body.innerHTML = `
            <div class="empty">
                Player statistics are not available yet.
            </div>
        `;

        return;

    }


    body.innerHTML =
        players
            .map(renderPlayerTeam)
            .join("");

}


function renderPlayerTeam(teamData) {

    const team =
        teamData.team || {};


    const players =
        Array.isArray(teamData.players)
            ? teamData.players
            : [];


    return `

        <div class="mc-section-title">

            ${escapeHTML(team.name || "")}

        </div>


        ${
            players.length
                ? players
                    .map(
                        player =>
                            renderPlayerStat(
                                player
                            )
                    )
                    .join("")
                : `
                    <div class="empty">
                        No player statistics returned.
                    </div>
                  `
        }

    `;

}


function renderPlayerStat(item) {

    const player =
        item.player || {};


    const stats =
        item.statistics?.[0] || {};


    const games =
        stats.games || {};

    const goals =
        stats.goals || {};

    const shots =
        stats.shots || {};

    const passes =
        stats.passes || {};

    const tackles =
        stats.tackles || {};

    const cards =
        stats.cards || {};


    return `

        <div class="player-stat-row">

            <div class="player-stat-main">

                ${
                    player.photo
                        ? `
                            <img
                                src="${escapeHTML(
                                    player.photo
                                )}"
                                alt=""
                            >
                          `
                        : `
                            <div
                                style="
                                    width:38px;
                                    height:38px;
                                    border-radius:50%;
                                    background:#26344b;
                                ">
                            </div>
                          `
                }


                <div class="player-stat-name">

                    ${escapeHTML(
                        player.name || "Unknown"
                    )}

                </div>


                <div class="rating">

                    ${
                        games.rating
                            ? escapeHTML(
                                String(
                                    games.rating
                                )
                            )
                            : "—"
                    }

                </div>

            </div>


            <div class="player-stat-details">

                <div>
                    Min
                    <strong>
                        ${escapeHTML(
                            String(
                                games.minutes ??
                                "—"
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Goals
                    <strong>
                        ${escapeHTML(
                            String(
                                goals.total ??
                                0
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Assists
                    <strong>
                        ${escapeHTML(
                            String(
                                goals.assists ??
                                0
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Shots
                    <strong>
                        ${escapeHTML(
                            String(
                                shots.total ??
                                "—"
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Passes
                    <strong>
                        ${escapeHTML(
                            String(
                                passes.total ??
                                "—"
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Tackles
                    <strong>
                        ${escapeHTML(
                            String(
                                tackles.total ??
                                "—"
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Yellow
                    <strong>
                        ${escapeHTML(
                            String(
                                cards.yellow ??
                                0
                            )
                        )}
                    </strong>
                </div>


                <div>
                    Red
                    <strong>
                        ${escapeHTML(
                            String(
                                cards.red ??
                                0
                            )
                        )}
                    </strong>
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   AUTO REFRESH MATCH CENTRE
========================================================= */

function startMatchCentreAutoRefresh() {

    stopMatchCentreAutoRefresh();


    if (!currentMatch) return;


    /*
     * Statistics/player data updates approximately every
     * minute during live matches according to API-Football.
     */

    if (!isLive(currentMatch)) {

        return;

    }


    matchCentreRefreshTimer =
        setInterval(
            async () => {

                if (!currentMatch) {

                    stopMatchCentreAutoRefresh();

                    return;

                }


                try {

                    await loadMatchDetails();

                } catch (error) {

                    console.error(
                        "Auto refresh failed:",
                        error
                    );

                }

            },
            60000
        );

}


function stopMatchCentreAutoRefresh() {

    if (matchCentreRefreshTimer) {

        clearInterval(
            matchCentreRefreshTimer
        );

        matchCentreRefreshTimer = null;

    }

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
