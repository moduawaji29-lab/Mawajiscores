<script>

/* =====================================================
   M.AWAJI LIVESCORES
   FRONTEND USES THE EXISTING VERCEL BACKEND
   ===================================================== */

const API_BASE =
"https://football-livescore-backend-new.vercel.app/api";


/* =====================================================
   APP STATE
   ===================================================== */

let selectedLeague = "39";

let selectedTab = "live";

let selectedDate = getLocalDate();


/* =====================================================
   DOM
   ===================================================== */

const matchesContainer =
document.getElementById("matches");

const statusBox =
document.getElementById("status");

const debugBox =
document.getElementById("debug");

const dateBar =
document.getElementById("dateBar");

const modal =
document.getElementById("matchModal");

const matchDetails =
document.getElementById("matchDetails");


/* =====================================================
   DATE
   ===================================================== */

function getLocalDate(){

    const now = new Date();

    const y =
        now.getFullYear();

    const m =
        String(now.getMonth()+1)
        .padStart(2,"0");

    const d =
        String(now.getDate())
        .padStart(2,"0");

    return `${y}-${m}-${d}`;
}


function formatDateShort(date){

    return date.toLocaleDateString(
        "en-NG",
        {
            weekday:"short",
            month:"short",
            day:"numeric"
        }
    );
}


function formatFullDate(date){

    return date.toLocaleDateString(
        "en-NG",
        {
            weekday:"long",
            year:"numeric",
            month:"long",
            day:"numeric"
        }
    );
}


function createDates(){

    dateBar.innerHTML = "";

    const today =
        new Date();

    for(let i=-2;i<=5;i++){

        const date =
            new Date(today);

        date.setDate(
            today.getDate()+i
        );

        const dateString =
            date.getFullYear() +
            "-" +
            String(
                date.getMonth()+1
            ).padStart(2,"0") +
            "-" +
            String(
                date.getDate()
            ).padStart(2,"0");


        const button =
            document.createElement("button");

        button.className =
            "date-btn";


        if(dateString === selectedDate){

            button.classList.add(
                "active"
            );

        }


        let label =
            formatDateShort(date);

        if(i === 0){

            label = "Today";

        }

        if(i === -1){

            label = "Yesterday";

        }

        if(i === 1){

            label = "Tomorrow";

        }


        button.innerHTML = `
            <strong>${escapeHTML(label)}</strong>
            <small>
                ${date.toLocaleDateString(
                    "en-NG",
                    {
                        day:"2-digit",
                        month:"short"
                    }
                )}
            </small>
        `;


        button.onclick = function(){

            selectedDate =
                dateString;

            createDates();

            loadMatches();

        };


        dateBar.appendChild(button);

    }

}


function goToday(){

    selectedDate =
        getLocalDate();

    createDates();

    loadMatches();

}


/* =====================================================
   API
   ===================================================== */

async function fetchAPI(action, extra=""){

    const url =
        `${API_BASE}?action=${action}${extra}`;


    const controller =
        new AbortController();

    const timeout =
        setTimeout(
            () => controller.abort(),
            20000
        );


    try{

        const response =
            await fetch(
                url,
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        const text =
            await response.text();


        let data;

        try{

            data =
                JSON.parse(text);

        }catch(e){

            data = {
                error:
                    text ||
                    "Invalid server response"
            };

        }


        if(!response.ok){

            throw new Error(
                data.error ||
                data.message ||
                `HTTP ${response.status}`
            );

        }


        return data;

    }

    catch(error){

        clearTimeout(timeout);

        if(
            error.name ===
            "AbortError"
        ){

            throw new Error(
                "Request timed out. Please check your connection."
            );

        }

        throw error;

    }

}


/* =====================================================
   NORMALIZE API DATA
   ===================================================== */

function getResponseArray(data){

    if(Array.isArray(data)){

        return data;

    }

    if(Array.isArray(data.response)){

        return data.response;

    }

    if(
        data.data &&
        Array.isArray(data.data)
    ){

        return data.data;

    }

    if(
        data.data &&
        Array.isArray(data.data.response)
    ){

        return data.data.response;

    }

    if(
        data.matches &&
        Array.isArray(data.matches)
    ){

        return data.matches;

    }

    return [];

}


/* =====================================================
   NORMALIZE MATCH
   ===================================================== */

function normalizeMatch(item){

    const fixture =
        item.fixture ||
        item;

    const teams =
        item.teams ||
        {};

    const goals =
        item.goals ||
        {};

    const league =
        item.league ||
        {};

    const score =
        item.score ||
        {};


    const home =
        teams.home ||
        item.homeTeam ||
        {};


    const away =
        teams.away ||
        item.awayTeam ||
        {};


    const status =
        fixture.status ||
        item.status ||
        {};


    const timestamp =
        fixture.timestamp ||
        item.timestamp;


    let utcDate =
        fixture.date ||
        item.utcDate ||
        item.date;


    if(
        !utcDate &&
        timestamp
    ){

        utcDate =
            new Date(
                timestamp * 1000
            ).toISOString();

    }


    return {

        id:
            fixture.id ||
            item.id ||
            null,

        utcDate:
            utcDate,

        status:
            status.short ||
            status.type ||
            item.status ||
            "NS",

        elapsed:
            status.elapsed ||
            item.elapsed ||
            null,

        statusLong:
            status.long ||
            "",

        homeName:
            home.name ||
            "Home",

        awayName:
            away.name ||
            "Away",

        homeLogo:
            home.logo ||
            home.crest ||
            "",

        awayLogo:
            away.logo ||
            away.crest ||
            "",

        homeScore:
            goals.home ??
            score.fullTime?.home ??
            score.home ??
            null,

        awayScore:
            goals.away ??
            score.fullTime?.away ??
            score.away ??
            null,

        leagueName:
            league.name ||
            item.competition?.name ||
            "Football",

        leagueCountry:
            league.country ||
            "",

        leagueLogo:
            league.logo ||
            "",

        venue:
            fixture.venue?.name ||
            item.venue ||
            "Not available",

        city:
            fixture.venue?.city ||
            "",

        referee:
            fixture.referee?.name ||
            item.referee ||
            "Not available",

        raw:
            item

    };

}


/* =====================================================
   LOAD MATCHES
   ===================================================== */

async function loadMatches(){

    matchesContainer.innerHTML = `
        <div class="loading">
            <div class="loading-spinner"></div>
            Loading football matches...
        </div>
    `;


    debugBox.style.display =
        "none";


    statusBox.className =
        "status";

    statusBox.textContent =
        "Loading real football data...";


    try{

        let data;


        /* LIVE */

        if(
            selectedTab ===
            "live"
        ){

            data =
                await fetchAPI(
                    "live"
                );

        }


        /* FIXTURES */

        else if(
            selectedTab ===
            "upcoming"
        ){

            data =
                await fetchAPI(
                    "fixtures",
                    `&date=${encodeURIComponent(
                        selectedDate
                    )}`
                );

        }


        /* RESULTS */

        else{

            data =
                await fetchAPI(
                    "results",
                    `&date=${encodeURIComponent(
                        selectedDate
                    )}`
                );

        }


        let rawMatches =
            getResponseArray(data);


        let matches =
            rawMatches
            .map(normalizeMatch);


        /* Filter selected league */

        matches =
            matches.filter(
                match => {

                    const raw =
                        match.raw;

                    const leagueId =
                        String(
                            raw.league?.id ||
                            raw.competition?.id ||
                            ""
                        );

                    return leagueId ===
                        String(selectedLeague);

                }
            );


        /* UPCOMING */

        if(
            selectedTab ===
            "upcoming"
        ){

            matches =
                matches.filter(
                    match =>
                        ![
                            "FT",
                            "AET",
                            "PEN",
                            "CANC",
                            "PST",
                            "ABD"
                        ].includes(
                            String(
                                match.status
                            ).toUpperCase()
                        )
                );

        }


        /* RESULTS */

        if(
            selectedTab ===
            "finished"
        ){

            matches =
                matches.filter(
                    match =>
                        [
                            "FT",
                            "AET",
                            "PEN"
                        ].includes(
                            String(
                                match.status
                            ).toUpperCase()
                        )
                );

        }


        /* Sort */

        matches.sort(
            (a,b) =>
                new Date(
                    a.utcDate || 0
                ) -
                new Date(
                    b.utcDate || 0
                )
        );


        displayMatches(matches);


    }

    catch(error){

        matchesContainer.innerHTML = `
            <div class="empty">
                <div class="empty-icon">⚠️</div>
                <strong>Unable to load matches</strong>
                <p style="margin-top:8px;font-size:11px">
                    ${escapeHTML(
                        error.message
                    )}
                </p>
            </div>
        `;


        statusBox.className =
            "status error";

        statusBox.textContent =
            "Football data could not be loaded";


        debugBox.style.display =
            "block";

        debugBox.innerHTML = `
            <strong>Error:</strong><br>
            ${escapeHTML(
                error.message
            )}
            <br><br>
            The frontend is connected to the M.Awaji Vercel backend.
        `;

    }

}


/* =====================================================
   DISPLAY MATCHES
   ===================================================== */

function displayMatches(matches){

    matchesContainer.innerHTML =
        "";


    if(!matches.length){

        statusBox.className =
            "status";

        statusBox.innerHTML = `
            No matches found for this league and date.
        `;

        matchesContainer.innerHTML = `
            <div class="empty">

                <div class="empty-icon">
                    ⚽
                </div>

                <strong>
                    No matches available
                </strong>

                <p style="margin-top:7px;font-size:11px">
                    Try another league or date.
                </p>

            </div>
        `;

        return;

    }


    statusBox.className =
        "status success";

    statusBox.textContent =
        `${matches.length} ${
            matches.length === 1
            ? "match"
            : "matches"
        } found`;


    matches.forEach(
        match => {

            const card =
                document.createElement(
                    "div"
                );


            const live =
                isLiveStatus(
                    match.status
                );


            if(live){

                card.classList.add(
                    "live-match"
                );

            }


            card.className +=
                " match";


            card.onclick =
                () =>
                    openMatchDetails(
                        match.id
                    );


            const time =
                formatNigeriaTime(
                    match.utcDate
                );


            const date =
                formatFullDate(
                    new Date(
                        match.utcDate
                    )
                );


            let centerHTML;


            if(live){

                centerHTML = `
                    <div class="score">
                        ${displayScore(
                            match.homeScore
                        )}
                        -
                        ${displayScore(
                            match.awayScore
                        )}
                    </div>

                    <div class="live">
                        <span class="live-dot"></span>

                        ${
                            match.elapsed
                            ?
                            escapeHTML(
                                String(
                                    match.elapsed
                                ) + "'"
                            )
                            :
                            "LIVE"
                        }

                    </div>
                `;

            }

            else if(
                isFinishedStatus(
                    match.status
                )
            ){

                centerHTML = `
                    <div class="score">
                        ${displayScore(
                            match.homeScore
                        )}
                        -
                        ${displayScore(
                            match.awayScore
                        )}
                    </div>

                    <div class="status-pill finished-pill">
                        FINISHED
                    </div>
                `;

            }

            else{

                centerHTML = `
                    <div class="vs">
                        VS
                    </div>

                    <div class="time">
                        🕐 ${escapeHTML(time)}
                    </div>

                    <div
                        class="countdown"
                        data-kickoff="${escapeHTML(
                            match.utcDate || ""
                        )}">
                    </div>
                `;

            }


            card.innerHTML = `

                <div class="competition">

                    <span>
                        🏆
                        ${escapeHTML(
                            match.leagueName
                        )}
                    </span>

                    <span>
                        ${escapeHTML(
                            match.leagueCountry
                        )}
                    </span>

                </div>


                <div class="match-date">
                    ${escapeHTML(date)}
                </div>


                <div class="teams">


                    <div class="team">

                        ${teamLogo(
                            match.homeLogo,
                            match.homeName
                        )}

                        <div class="team-name">
                            ${escapeHTML(
                                match.homeName
                            )}
                        </div>

                    </div>


                    <div>
                        ${centerHTML}
                    </div>


                    <div class="team">

                        ${teamLogo(
                            match.awayLogo,
                            match.awayName
                        )}

                        <div class="team-name">
                            ${escapeHTML(
                                match.awayName
                            )}
                        </div>

                    </div>

                </div>


                <div class="match-info-hint">
                    Tap for match information
                </div>

            `;


            matchesContainer.appendChild(
                card
            );

        }
    );


    updateCountdowns();

}


/* =====================================================
   LOGO
   ===================================================== */

function teamLogo(url,name){

    if(url){

        return `
            <img
                src="${escapeHTML(url)}"
                alt="${escapeHTML(name)}"
                onerror="this.outerHTML='<div class=&quot;team-placeholder&quot;>⚽</div>'"
            >
        `;

    }

    return `
        <div class="team-placeholder">
            ⚽
        </div>
    `;

}


/* =====================================================
   SCORE
   ===================================================== */

function displayScore(score){

    return (
        score === null ||
        score === undefined
    )
    ?
        "-"
    :
        escapeHTML(
            String(score)
        );

}


/* =====================================================
   STATUS HELPERS
   ===================================================== */

function isLiveStatus(status){

    return [
        "LIVE",
        "1H",
        "2H",
        "ET",
        "P",
        "BT",
        "HT",
        "IN_PLAY",
        "PAUSED"
    ].includes(
        String(status)
        .toUpperCase()
    );

}


function isFinishedStatus(status){

    return [
        "FT",
        "AET",
        "PEN"
    ].includes(
        String(status)
        .toUpperCase()
    );

}


/* =====================================================
   TIME
   ===================================================== */

function formatNigeriaTime(utcDate){

    if(!utcDate){

        return "Time unavailable";

    }

    return new Date(
        utcDate
    ).toLocaleTimeString(
        "en-NG",
        {
            timeZone:
                "Africa/Lagos",
            hour:"2-digit",
            minute:"2-digit",
            hour12:false
        }
    );

}


/* =====================================================
   COUNTDOWN
   ===================================================== */

function updateCountdowns(){

    document
    .querySelectorAll(
        "[data-kickoff]"
    )
    .forEach(
        element => {

            const kickoff =
                new Date(
                    element.dataset.kickoff
                );

            const diff =
                kickoff.getTime() -
                Date.now();


            if(diff <= 0){

                element.textContent =
                    "";

                return;

            }


            const minutes =
                Math.floor(
                    diff /
                    60000
                );


            const hours =
                Math.floor(
                    minutes /
                    60
                );


            const mins =
                minutes % 60;


            if(hours > 0){

                element.textContent =
                    `Starts in ${hours}h ${mins}m`;

            }

            else{

                element.textContent =
                    `Starts in ${mins}m`;

            }

        }
    );

}


setInterval(
    updateCountdowns,
    30000
);

    try{

        const data =
            await fetchAPI(
                "match",
                `&id=${encodeURIComponent(

                )}`

        let raw =
            data.response?.[0] ||
            data.data?.response?.[0] ||

        const match =
            normalizeMatch(

            );


        renderMatchDetails(
            match

                        error.message

                </p>

    }

/* =====================================================
   EVENTS
   ===================================================== */

function renderEvents(events,match){

    if(!Array.isArray(events)){
        return "";
    }


    let html = `

        <div class="details-section">

            <div class="details-section-title">
                ⚡ Match Events
            </div>
    `;


    events.forEach(
        event => {

            const time =
                event.time?.elapsed ??
                event.time?.extra ??
                "";


            const type =
                event.type ||
                "Event";


            const detail =
                event.detail ||
                "";


            const player =
                event.player?.name ||
                "";


            const assist =
                event.assist?.name ||
                "";


            html += `

                <div class="event">

                    <div class="event-time">
                        ${escapeHTML(
                            String(time)
                        )}'
                    </div>


                    <div class="event-main">

                        <div class="event-type">
                            ${eventIcon(
                                type,
                                detail
                            )}
                            ${escapeHTML(
                                detail ||
                                type
                            )}
                        </div>

                        ${
                            player
                            ?
                            `
                            <div class="event-player">
                                ${escapeHTML(
                                    player
                                )}

                                ${
                                    assist
                                    ?
                                    " • " +
                                    escapeHTML(
                                        assist
                                    )
                                    :
                                    ""
                                }
                            </div>
                            `
                            :
                            ""
                        }

                    </div>


                    <div></div>

                </div>

            `;

        }
    );


    html += `
        </div>
    `;


    return html;

}


function eventIcon(type,detail){

    const value =
        `${type} ${detail}`
        .toLowerCase();


    if(value.includes("goal")){
        return "⚽";
    }

    if(value.includes("yellow")){
        return "🟨";
    }

    if(value.includes("red")){
        return "🟥";
    }

    if(value.includes("sub")){
        return "🔄";
    }

    if(value.includes("penalty")){
        return "🎯";
    }

    return "•";

}


/* =====================================================
   STATISTICS
   ===================================================== */

function renderStatistics(statistics){

    if(!Array.isArray(statistics)){
        return "";
    }


    let html = `

        <div class="details-section">

            <div class="details-section-title">
                📊 Match Statistics
            </div>
    `;


    statistics.forEach(
        teamStats => {

            const stats =
                teamStats.statistics ||
                [];


            stats.forEach(
                stat => {

                    const label =
                        stat.type ||
                        "Statistic";


                    const value =
                        stat.value;


                    html += `

                        <div class="stat-row">

                            <div class="stat-value">
                                ${
                                    Array.isArray(
                                        value
                                    )
                                    ?
                                    escapeHTML(
                                        String(
                                            value[0]
                                        )
                                    )
                                    :
                                    escapeHTML(
                                        String(
                                            value ??
                                            "-"
                                        )
                                    )
                                }
                            </div>

                            <div class="stat-label">
                                ${escapeHTML(
                                    label
                                )}
                            </div>

                            <div class="stat-value">
                                ${
                                    Array.isArray(
                                        value
                                    )
                                    ?
                                    escapeHTML(
                                        String(
                                            value[1]
                                        )
                                    )
                                    :
                                    ""
                                }
                            </div>

                        </div>

                    `;

                }
            );

        }
    );


    html += `
        </div>
    `;


    return html;

}


/* =====================================================
   SHARE
   ===================================================== */

async function shareMatch(home,away){

    const title =
        `${home} vs ${away}`;

    const text =
        `Check ${home} vs ${away} on M.Awaji LiveScores`;


    try{

        if(
            navigator.share
        ){

            await navigator.share({
                title,
                text,
                url:
                    window.location.href
            });

        }

        else{

            await navigator.clipboard.writeText(
                `${text} - ${window.location.href}`
            );

            alert(
                "Match link copied."
            );

        }

    }

    catch(error){

        // User cancelled sharing.

    }

}

/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}
