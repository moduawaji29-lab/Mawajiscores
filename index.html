<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top 5 Leagues - Live Scores</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

header {
    background: linear-gradient(135deg, #008000, #0066cc);
    padding: 18px;
    text-align: center;
}

header h1 {
    margin: 0;
    font-size: 23px;
}

.subtitle {
    margin-top: 5px;
    font-size: 12px;
    opacity: .85;
}

.tabs {
    display: flex;
    gap: 5px;
    padding: 10px;
    background: #1c1c1c;
}

.tabs button {
    flex: 1;
    padding: 12px 5px;
    border: none;
    border-radius: 6px;
    background: #333;
    color: white;
    font-weight: bold;
}

.tabs button.active {
    background: #008000;
}

.leagues {
    display: flex;
    overflow-x: auto;
    padding: 10px;
    gap: 8px;
}

.leagues::-webkit-scrollbar,
.date-bar::-webkit-scrollbar {
    display: none;
}

.leagues button {
    white-space: nowrap;
    padding: 9px 14px;
    border: none;
    border-radius: 20px;
    background: #292929;
    color: white;
}

.leagues button.active {
    background: #0066cc;
}

.date-bar {
    display: flex;
    overflow-x: auto;
    gap: 7px;
    padding: 10px;
}

.date-bar button {
    min-width: 78px;
    padding: 9px;
    border: none;
    border-radius: 6px;
    background: #292929;
    color: white;
}

.date-bar button.active {
    background: #008000;
}

#matches {
    padding-bottom: 20px;
}

.match {
    background: #1d1d1d;
    margin: 8px;
    padding: 14px;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,.3);
}

.league-name {
    color: #00aaff;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
}

.match-time {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-bottom: 10px;
}

.teams {
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-align: center;
}

.team {
    width: 37%;
    font-size: 14px;
    font-weight: bold;
}

.team img {
    width: 42px;
    height: 42px;
    object-fit: contain;
    display: block;
    margin: auto auto 7px;
}

.score-area {
    width: 22%;
    text-align: center;
}

.score {
    font-size: 21px;
    font-weight: bold;
}

.status {
    margin-top: 5px;
    color: #00ff66;
    font-size: 12px;
    font-weight: bold;
}

.status.finished {
    color: #aaa;
}

.status.scheduled {
    color: #00aaff;
}

.loading,
.no-match,
.error {
    text-align: center;
    padding: 35px 20px;
}

.error {
    color: #ff5555;
}

.info {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    padding: 10px 20px;
}

.refresh {
    position: fixed;
    right: 15px;
    bottom: 20px;
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 50%;
    background: #008000;
    color: white;
    font-size: 20px;
    box-shadow: 0 3px 10px rgba(0,0,0,.5);
}
</style>
</head>

<body>

<header>
    <h1>⚽ LIVE FOOTBALL SCORES</h1>
    <div class="subtitle">Powered by football-data.org</div>
</header>


<!-- TABS -->

<div class="tabs">

    <button id="liveBtn"
            class="active"
            onclick="showLive()">
        LIVE
    </button>

    <button id="upcomingBtn"
            onclick="showUpcoming()">
        UPCOMING
    </button>

    <button id="finishedBtn"
            onclick="showFinished()">
        FINISHED
    </button>

</div>


<!-- LEAGUES -->

<div class="leagues">

    <button
        id="league-PL"
        onclick="selectLeague('PL')">
        Premier League
    </button>

    <button
        id="league-PD"
        onclick="selectLeague('PD')">
        La Liga
    </button>

    <button
        id="league-SA"
        onclick="selectLeague('SA')">
        Serie A
    </button>

    <button
        id="league-BL1"
        onclick="selectLeague('BL1')">
        Bundesliga
    </button>

    <button
        id="league-FL1"
        onclick="selectLeague('FL1')">
        Ligue 1
    </button>

    <button
        id="league-CL"
        onclick="selectLeague('CL')">
        Champions League
    </button>

</div>


<!-- DATES -->

<div class="date-bar" id="dateBar"></div>


<!-- MATCHES -->

<div id="matches">

    <div class="loading">
        Loading matches...
    </div>

</div>


<div class="info">
    Match data provided by football-data.org
</div>


<button class="refresh"
        onclick="refreshCurrentPage()">
    ↻
</button>


<script>

/* =========================================================
   FOOTBALL-DATA.ORG CONFIGURATION
   ========================================================= */

/*
   PASTE YOUR TOKEN BETWEEN THE QUOTES.

   Example:

   const API_TOKEN = "abc123xxxxxxxx";

   DO NOT SHARE YOUR TOKEN PUBLICLY.
*/

const API_TOKEN = "8963e3ad73f146e5ad4344562d2162a0";


/*
   FOOTBALL-DATA.ORG V4
*/

const API_URL =
    "https://api.football-data.org/v4";


/*
   Default league
*/

let selectedLeague = "PL";


/*
   Default date = today
*/

let selectedDate = new Date();


/*
   Current screen
*/

let currentView = "live";


/* =========================================================
   COMPETITIONS
   ========================================================= */

const competitions = {

    "PL": "Premier League",

    "PD": "La Liga",

    "SA": "Serie A",

    "BL1": "Bundesliga",

    "FL1": "Ligue 1",

    "CL": "UEFA Champions League"

};


/* =========================================================
   DATE FORMATTER
   ========================================================= */

function formatDate(date) {

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
        .padStart(2, "0");

    const day =
        String(date.getDate())
        .padStart(2, "0");

    return `${year}-${month}-${day}`;
}


/* =========================================================
   DATE BAR
   ========================================================= */

function createDateBar() {

    const bar =
        document.getElementById("dateBar");

    bar.innerHTML = "";

    for (let i = 0; i < 7; i++) {

        const date = new Date();

        date.setDate(
            date.getDate() + i
        );

        const button =
            document.createElement("button");


        if (i === 0) {

            button.innerText = "TODAY";

        } else if (i === 1) {

            button.innerText = "TOMORROW";

        } else {

            button.innerText =
                date.toLocaleDateString(
                    "en-US",
                    {
                        weekday: "short",
                        day: "numeric"
                    }
                );
        }


        button.onclick = function () {

            selectedDate = date;

            document
                .querySelectorAll(".date-bar button")
                .forEach(b =>
                    b.classList.remove("active")
                );

            button.classList.add("active");


            if (currentView === "live") {

                showLive();

            } else if (currentView === "upcoming") {

                showUpcoming();

            } else {

                showFinished();
            }

        };


        if (i === 0) {

            button.classList.add("active");
        }


        bar.appendChild(button);
    }
}


/* =========================================================
   API REQUEST
   ========================================================= */

async function apiRequest(endpoint) {

    if (
        !API_TOKEN ||
        API_TOKEN ===
        "PASTE_YOUR_FOOTBALL_DATA_TOKEN_HERE"
    ) {

        throw new Error(
            "API token has not been added."
        );
    }


    const response =
        await fetch(
            API_URL + endpoint,
            {
                method: "GET",

                headers: {

                    "X-Auth-Token":
                        API_TOKEN,

                    "Accept":
                        "application/json"
                }
            }
        );


    if (!response.ok) {

        let message =
            `HTTP ${response.status}`;

        try {

            const errorData =
                await response.json();

            if (errorData.message) {

                message +=
                    " - " +
                    errorData.message;
            }

        } catch (e) {}

        throw new Error(message);
    }


    return await response.json();
}


/* =========================================================
   LOAD COMPETITION MATCHES
   ========================================================= */

async function loadCompetitionMatches(
    competitionCode,
    date
) {

    const dateString =
        formatDate(date);


    const endpoint =
        `/competitions/${competitionCode}/matches` +
        `?dateFrom=${dateString}` +
        `&dateTo=${dateString}`;


    return await apiRequest(endpoint);
}


/* =========================================================
   DISPLAY MATCHES
   ========================================================= */

function displayMatches(matches) {

    const container =
        document.getElementById("matches");

    container.innerHTML = "";


    if (
        !matches ||
        matches.length === 0
    ) {

        container.innerHTML = `
            <div class="no-match">
                ⚽ No matches available
                for this selection.
            </div>
        `;

        return;
    }


    /*
       Sort matches by kickoff time
    */

    matches.sort(
        (a, b) =>
            new Date(a.utcDate) -
            new Date(b.utcDate)
    );


    matches.forEach(match => {

        const home =
            match.homeTeam || {};

        const away =
            match.awayTeam || {};


        const homeScore =
            match.score &&
            match.score.fullTime &&
            match.score.fullTime.home
            !== null
                ? match.score.fullTime.home
                : "-";


        const awayScore =
            match.score &&
            match.score.fullTime &&
            match.score.fullTime.away
            !== null
                ? match.score.fullTime.away
                : "-";


        let statusText =
            getStatusText(match);


        let statusClass =
            getStatusClass(match.status);


        const kickoff =
            new Date(match.utcDate)
            .toLocaleTimeString(
                [],
                {
                    hour: "2-digit",
                    minute: "2-digit"
                }
            );


        const div =
            document.createElement("div");

        div.className = "match";


        div.innerHTML = `

            <div class="league-name">

                ${escapeHTML(
                    match.competition?.name ||
                    "Football"
                )}

            </div>


            <div class="match-time">

                ${kickoff}

            </div>


            <div class="teams">


                <div class="team">

                    <img
                        src="${home.crest || ""}"
                        onerror="this.style.display='none'"
                        alt=""
                    >

                    <div>
                        ${escapeHTML(
                            home.name ||
                            "Home Team"
                        )}
                    </div>

                </div>


                <div class="score-area">

                    <div class="score">

                        ${homeScore}
                        -
                        ${awayScore}

                    </div>


                    <div class="status ${statusClass}">

                        ${statusText}

                    </div>

                </div>


                <div class="team">

                    <img
                        src="${away.crest || ""}"
                        onerror="this.style.display='none'"
                        alt=""
                    >

                    <div>
                        ${escapeHTML(
                            away.name ||
                            "Away Team"
                        )}
                    </div>

                </div>


            </div>

        `;


        container.appendChild(div);

    });

}


/* =========================================================
   STATUS TEXT
   ========================================================= */

function getStatusText(match) {

    const status =
        match.status;


    if (
        status === "IN_PLAY" ||
        status === "LIVE"
    ) {

        if (match.minute) {

            return `🔴 ${match.minute}'`;

        }

        return "🔴 LIVE";
    }


    if (status === "PAUSED") {

        return "⏸ HALF TIME";
    }


    if (status === "FINISHED") {

        return "FT";
    }


    if (status === "POSTPONED") {

        return "POSTPONED";
    }


    if (status === "CANCELLED") {

        return "CANCELLED";
    }


    if (status === "SUSPENDED") {

        return "SUSPENDED";
    }


    return "SCHEDULED";
}


/* =========================================================
   STATUS CLASS
   ========================================================= */

function getStatusClass(status) {

    if (
        status === "IN_PLAY" ||
        status === "LIVE" ||
        status === "PAUSED"
    ) {

        return "";
    }


    if (status === "FINISHED") {

        return "finished";
    }


    return "scheduled";
}


/* =========================================================
   LIVE MATCHES
   ========================================================= */

async function showLive() {

    currentView = "live";

    setActive("liveBtn");


    const container =
        document.getElementById("matches");


    container.innerHTML = `
        <div class="loading">
            🔴 Loading live matches...
        </div>
    `;


    try {

        const today =
            formatDate(new Date());


        /*
           Get today's matches for the
           selected competition.
        */

        const data =
            await loadCompetitionMatches(
                selectedLeague,
                new Date()
            );


        let matches =
            data.matches || [];


        /*
           Keep only live matches.
        */

        matches =
            matches.filter(match =>

                [
                    "LIVE",
                    "IN_PLAY",
                    "PAUSED"
                ].includes(match.status)

            );


        displayMatches(matches);


    } catch (error) {

        showAPIError(error);

    }
}


/* =========================================================
   UPCOMING
   ========================================================= */

async function showUpcoming() {

    currentView = "upcoming";

    setActive("upcomingBtn");


    const container =
        document.getElementById("matches");


    container.innerHTML = `
        <div class="loading">
            📅 Loading upcoming matches...
        </div>
    `;


    try {

        const data =
            await loadCompetitionMatches(
                selectedLeague,
                selectedDate
            );


        let matches =
            data.matches || [];


        matches =
            matches.filter(match =>

                [
                    "SCHEDULED",
                    "TIMED"
                ].includes(match.status)

            );


        displayMatches(matches);


    } catch (error) {

        showAPIError(error);

    }
}


/* =========================================================
   FINISHED
   ========================================================= */

async function showFinished() {

    currentView = "finished";

    setActive("finishedBtn");


    const container =
        document.getElementById("matches");


    container.innerHTML = `
        <div class="loading">
            ✅ Loading finished matches...
        </div>
    `;


    try {

        const data =
            await loadCompetitionMatches(
                selectedLeague,
                selectedDate
            );


        let matches =
            data.matches || [];


        matches =
            matches.filter(match =>

                [
                    "FINISHED"
                ].includes(match.status)

            );


        displayMatches(matches);


    } catch (error) {

        showAPIError(error);

    }
}


/* =========================================================
   SELECT LEAGUE
   ========================================================= */

function selectLeague(code) {

    selectedLeague = code;


    document
        .querySelectorAll(".leagues button")
        .forEach(button => {

            button.classList.remove("active");

        });


    const selectedButton =
        document.getElementById(
            "league-" + code
        );


    if (selectedButton) {

        selectedButton.classList.add("active");
    }


    if (currentView === "live") {

        showLive();

    } else if (currentView === "upcoming") {

        showUpcoming();

    } else {

        showFinished();
    }
}


/* =========================================================
   ACTIVE TAB
   ========================================================= */

function setActive(id) {

    document
        .querySelectorAll(".tabs button")
        .forEach(button => {

            button.classList.remove("active");

        });


    document
        .getElementById(id)
        .classList.add("active");
}


/* =========================================================
   API ERROR
   ========================================================= */

function showAPIError(error) {

    const container =
        document.getElementById("matches");


    console.error(error);


    container.innerHTML = `

        <div class="error">

            ⚠️ Unable to load matches.

            <br><br>

            <small>
                ${escapeHTML(
                    error.message ||
                    "Unknown API error"
                )}
            </small>

        </div>

    `;
}


/* =========================================================
   REFRESH
   ========================================================= */

function refreshCurrentPage() {

    if (currentView === "live") {

        showLive();

    } else if (currentView === "upcoming") {

        showUpcoming();

    } else {

        showFinished();
    }
}


/* =========================================================
   AUTO REFRESH LIVE SCORES
   ========================================================= */

/*
   Refresh every 60 seconds.

   This is deliberately not extremely frequent
   because football-data.org applies request limits.
*/

setInterval(() => {

    if (currentView === "live") {

        showLive();

    }

}, 60000);


/* =========================================================
   HTML SECURITY
   ========================================================= */

function escapeHTML(value) {

    if (!value) return "";

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   START APPLICATION
   ========================================================= */

createDateBar();


/*
   Highlight Premier League
*/

selectLeague("PL");


/*
   Open LIVE
*/

showLive();

</script>

</body>
</html>
