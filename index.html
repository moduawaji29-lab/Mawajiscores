<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#111111"><title>Mawaji Scores - Live Football</title><style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #0b0b0b;
    color: #ffffff;
}

/* HEADER */

.header {
    background: linear-gradient(90deg, #11a36a, #0785ff);
    padding: 14px 10px;
    text-align: center;
    font-size: 19px;
    font-weight: bold;
}

/* AD */

.ad {
    margin: 10px auto;
    max-width: 360px;
    height: 60px;
    background: #202020;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #777;
    font-size: 12px;
}

/* LEAGUES */

.leagues {
    display: flex;
    overflow-x: auto;
    gap: 7px;
    padding: 10px;
    background: #111111;
}

.leagues::-webkit-scrollbar {
    display: none;
}

.league-btn {
    flex: 0 0 auto;
    border: none;
    background: #292929;
    color: white;
    padding: 9px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.league-btn.active {
    background: #168cff;
}

/* TABS */

.tabs {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 8px;
}

.tab {
    border: none;
    background: #292929;
    color: white;
    padding: 10px 15px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    background: #168cff;
}

/* REFRESH */

.refresh-box {
    text-align: center;
    padding: 5px 0 10px;
}

.refresh {
    border: none;
    background: #333333;
    color: white;
    padding: 9px 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
}

.refresh:active {
    transform: scale(.96);
}

/* TITLE */

.section-title {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin: 8px 0 12px;
}

/* LOADING */

.loading {
    text-align: center;
    padding: 35px 10px;
    color: #aaa;
}

.spinner {
    width: 35px;
    height: 35px;
    border: 4px solid #333;
    border-top: 4px solid #168cff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: auto auto 15px;
}

@keyframes spin {
    100% {
        transform: rotate(360deg);
    }
}

/* ERROR */

.error {
    margin: 15px;
    padding: 15px;
    border-radius: 10px;
    background: #421818;
    color: #ff9a9a;
    text-align: center;
}

/* EMPTY */

.empty {
    margin: 15px;
    padding: 25px 15px;
    background: #1b1b1b;
    border-radius: 10px;
    text-align: center;
    color: #999;
}

/* MATCH */

.match {
    margin: 10px;
    padding: 13px;
    background: #1c1c1c;
    border-radius: 11px;
    border-left: 4px solid #168cff;
}

.match-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
}

.league-name {
    color: #42aaff;
    font-size: 13px;
    font-weight: bold;
}

.match-status {
    font-size: 11px;
    font-weight: bold;
    color: #aaa;
}

.live-status {
    color: #ff4242;
}

.team-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 8px 0;
}

.team {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 70%;
    font-size: 14px;
    font-weight: bold;
}

.team img {
    width: 28px;
    height: 28px;
    object-fit: contain;
}

.score {
    width: 30%;
    text-align: right;
    font-size: 18px;
    font-weight: bold;
}

.time {
    text-align: center;
    color: #ffc107;
    font-size: 13px;
    font-weight: bold;
    margin: 8px 0;
}

.venue {
    text-align: center;
    color: #777;
    font-size: 10px;
    margin-top: 8px;
}

/* LIVE CARD */

.match.live {
    border-left-color: #ff3030;
}

.live-minute {
    color: #ff3030;
    font-weight: bold;
}

/* FOOTER */

.footer {
    text-align: center;
    color: #555;
    font-size: 11px;
    padding: 25px 10px;
}

</style></head><body><!-- HEADER --><div class="header">
    ⚽ Mawaji Scores
</div><!-- AD PLACEHOLDER --><div class="ad">
    AdMob Banner
</div><!-- LEAGUES --><div class="leagues"><button class="league-btn active"
data-league="all"
onclick="selectLeague('all', this)">
    🌍 All
</button>

<button class="league-btn"
data-league="39"
onclick="selectLeague('39', this)">
    🏴 Premier League
</button>

<button class="league-btn"
data-league="140"
onclick="selectLeague('140', this)">
    🇪🇸 La Liga
</button>

<button class="league-btn"
data-league="135"
onclick="selectLeague('135', this)">
    🇮🇹 Serie A
</button>

<button class="league-btn"
data-league="78"
onclick="selectLeague('78', this)">
    🇩🇪 Bundesliga
</button>

<button class="league-btn"
data-league="61"
onclick="selectLeague('61', this)">
    🇫🇷 Ligue 1
</button>

<button class="league-btn"
data-league="2"
onclick="selectLeague('2', this)">
    🏆 Champions League
</button>

</div><!-- TABS --><div class="tabs"><button
class="tab active"
onclick="changeTab('live', this)">
    🔴 Live
</button>

<button
class="tab"
onclick="changeTab('upcoming', this)">
    📅 Upcoming
</button>

<button
class="tab"
onclick="changeTab('finished', this)">
    ✅ Finished
</button>

</div><!-- REFRESH --><div class="refresh-box"><button class="refresh"
onclick="loadMatches(true)">
    🔄 Refresh
</button>

</div><!-- TITLE --><div class="section-title" id="sectionTitle">
    🔴 Live Matches
</div><!-- MATCHES --><div id="matches"><div class="loading">

    <div class="spinner"></div>

    Loading football matches...

</div>

</div><div class="footer">Mawaji Scores<br>
Powered by API-Football

</div><script>

/* =====================================================
   API CONFIGURATION
   ===================================================== */

const API_KEY = "71548bfb1ba52c55ebc278cb4c8b8780";

const API_URL =
"https://v3.football.api-sports.io";


/* =====================================================
   LEAGUES
   ===================================================== */

const LEAGUES = {

    "39": "Premier League",

    "140": "La Liga",

    "135": "Serie A",

    "78": "Bundesliga",

    "61": "Ligue 1",

    "2": "Champions League"

};


/* =====================================================
   APP STATE
   ===================================================== */

let selectedLeague = "all";

let selectedTab = "live";

let todayMatches = [];

let liveMatches = [];


/* =====================================================
   GET TODAY'S DATE
   NIGERIA TIME
   ===================================================== */

function getToday() {

    const parts =
        new Intl.DateTimeFormat(
            "en-CA",
            {
                timeZone: "Africa/Lagos",
                year: "numeric",
                month: "2-digit",
                day: "2-digit"
            }
        ).formatToParts(new Date());

    let year =
        parts.find(p => p.type === "year").value;

    let month =
        parts.find(p => p.type === "month").value;

    let day =
        parts.find(p => p.type === "day").value;

    return `${year}-${month}-${day}`;

}


/* =====================================================
   LOAD TODAY'S FIXTURES
   ===================================================== */

async function loadTodayFixtures() {

    const today = getToday();

    const url =
        `${API_URL}/fixtures?date=${today}&timezone=Africa/Lagos`;


    const response = await fetch(url, {

        method: "GET",

        headers: {

            "x-apisports-key": API_KEY

        }

    });


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            "HTTP Error " + response.status
        );

    }


    if (
        data.errors &&
        Object.keys(data.errors).length > 0
    ) {

        throw new Error(
            JSON.stringify(data.errors)
        );

    }


    todayMatches =
        data.response || [];

}


/* =====================================================
   LOAD LIVE FIXTURES
   ===================================================== */

async function loadLiveFixtures() {

    const url =
        `${API_URL}/fixtures?live=all&timezone=Africa/Lagos`;


    const response = await fetch(url, {

        method: "GET",

        headers: {

            "x-apisports-key": API_KEY

        }

    });


    const data =
        await response.json();


    if (!response.ok) {

        throw new Error(
            "HTTP Error " + response.status
        );

    }


    if (
        data.errors &&
        Object.keys(data.errors).length > 0
    ) {

        throw new Error(
            JSON.stringify(data.errors)
        );

    }


    liveMatches =
        data.response || [];

}


/* =====================================================
   MAIN LOAD
   ===================================================== */

async function loadMatches(force = false) {

    const container =
        document.getElementById("matches");


    container.innerHTML = `

        <div class="loading">

            <div class="spinner"></div>

            Loading matches...

        </div>

    `;


    try {

        await loadTodayFixtures();


        if (selectedTab === "live") {

            await loadLiveFixtures();

        }


        renderMatches();

    }

    catch (error) {

        console.error(error);


        container.innerHTML = `

            <div class="error">

                ❌ API request failed.

                <br><br>

                ${escapeHTML(error.message)}

                <br><br>

                Please check your API key.

            </div>

        `;

    }

}


/* =====================================================
   FILTER LEAGUE
   ===================================================== */

function filterLeague(matches) {

    if (selectedLeague === "all") {

        return matches.filter(match =>

            LEAGUES[
                String(match.league.id)
            ]

        );

    }


    return matches.filter(match =>

        String(match.league.id) ===
        String(selectedLeague)

    );

}


/* =====================================================
   RENDER MATCHES
   ===================================================== */

function renderMatches() {

    const container =
        document.getElementById("matches");


    let matches = [];


    if (selectedTab === "live") {

        matches =
            filterLeague(liveMatches);

    }


    else if (selectedTab === "upcoming") {

        matches =
            filterLeague(todayMatches)
            .filter(match =>

                [
                    "NS",
                    "TBD"
                ].includes(
                    match.fixture.status.short
                )

            );

    }


    else {

        matches =
            filterLeague(todayMatches)
            .filter(match =>

                [
                    "FT",
                    "AET",
                    "PEN"
                ].includes(
                    match.fixture.status.short
                )

            );

    }


    matches.sort((a, b) =>

        new Date(a.fixture.date) -
        new Date(b.fixture.date)

    );


    if (matches.length === 0) {

        container.innerHTML = `

            <div class="empty">

                ${
                    selectedTab === "live"
                    ? "🔴 No live matches right now."
                    : selectedTab === "upcoming"
                    ? "📅 No upcoming matches today."
                    : "✅ No finished matches today."
                }

                <br><br>

                Try another league or refresh.

            </div>

        `;

        return;

    }


    container.innerHTML =
        matches
        .map(createMatchCard)
        .join("");

}


/* =====================================================
   CREATE MATCH CARD
   ===================================================== */

function createMatchCard(match) {

    const fixture =
        match.fixture;

    const league =
        match.league;

    const teams =
        match.teams;

    const goals =
        match.goals;

    const status =
        fixture.status;


    const isLive =
        [
            "1H",
            "HT",
            "2H",
            "ET",
            "BT",
            "P"
        ].includes(status.short);


    let statusText =
        status.short;


    if (isLive) {

        if (status.elapsed) {

            statusText =
                `${status.elapsed}'`;

        }

        else {

            statusText =
                "LIVE";

        }

    }


    let matchTime = "";


    if (status.short === "NS") {

        matchTime =
            formatTime(fixture.date);

    }


    const homeScore =
        goals.home ?? "-";

    const awayScore =
        goals.away ?? "-";


    const venue =
        fixture.venue &&
        fixture.venue.name
        ? fixture.venue.name
        : "";


    return `

        <div class="match ${isLive ? "live" : ""}">

            <div class="match-header">

                <div class="league-name">

                    ${escapeHTML(
                        league.name
                    )}

                </div>


                <div class="
                    match-status
                    ${isLive ? "live-status" : ""}
                ">

                    ${
                        isLive
                        ? "🔴 " + statusText
                        : statusText
                    }

                </div>

            </div>


            ${
                matchTime
                ? `
                    <div class="time">

                        ⏰ ${matchTime}

                    </div>
                `
                : ""
            }


            <div class="team-row">

                <div class="team">

                    ${
                        teams.home.logo
                        ? `
                            <img
                            src="${teams.home.logo}"
                            alt=""
                            onerror="this.style.display='none'"
                            >
                        `
                        : ""
                    }

                    <span>

                        ${escapeHTML(
                            teams.home.name
                        )}

                    </span>

                </div>


                <div class="score">

                    ${homeScore}

                </div>

            </div>


            <div class="team-row">

                <div class="team">

                    ${
                        teams.away.logo
                        ? `
                            <img
                            src="${teams.away.logo}"
                            alt=""
                            onerror="this.style.display='none'"
                            >
                        `
                        : ""
                    }

                    <span>

                        ${escapeHTML(
                            teams.away.name
                        )}

                    </span>

                </div>


                <div class="score">

                    ${awayScore}

                </div>

            </div>


            ${
                venue
                ? `
                    <div class="venue">

                        🏟️ ${escapeHTML(venue)}

                    </div>
                `
                : ""
            }

        </div>

    `;

}


/* =====================================================
   FORMAT TIME
   ===================================================== */

function formatTime(dateString) {

    return new Intl.DateTimeFormat(

        "en-NG",

        {

            timeZone: "Africa/Lagos",

            hour: "2-digit",

            minute: "2-digit",

            hour12: true

        }

    ).format(
        new Date(dateString)
    );

}


/* =====================================================
   SELECT LEAGUE
   ===================================================== */

function selectLeague(id, button) {

    selectedLeague = id;


    document
        .querySelectorAll(".league-btn")
        .forEach(btn =>

            btn.classList.remove("active")

        );


    button.classList.add("active");


    renderMatches();

}


/* =====================================================
   CHANGE TAB
   ===================================================== */

function changeTab(tab, button) {

    selectedTab = tab;


    document
        .querySelectorAll(".tab")
        .forEach(btn =>

            btn.classList.remove("active")

        );


    button.classList.add("active");


    const title =
        document.getElementById("sectionTitle");


    if (tab === "live") {

        title.innerHTML =
            "🔴 Live Matches";

    }

    else if (tab === "upcoming") {

        title.innerHTML =
            "📅 Upcoming Matches";

    }

    else {

        title.innerHTML =
            "✅ Finished Matches";

    }


    loadMatches();

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHTML(value) {

    if (value === null ||
        value === undefined) {

        return "";

    }


    return String(value)

        .replace(/&/g, "&amp;")

        .replace(/</g, "&lt;")

        .replace(/>/g, "&gt;")

        .replace(/"/g, "&quot;")

        .replace(/'/g, "&#039;");

}


/* =====================================================
   START APP
   ===================================================== */

loadMatches();

</script></body></html>
