<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#070b10;
    --panel:#111820;
    --panel2:#151e27;
    --line:#26323d;
    --green:#00c878;
    --green2:#075c43;
    --text:#f4f7f8;
    --muted:#8d99a5;
    --red:#ff4655;
    --yellow:#ffc857;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button{
    font:inherit;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:50;
    background:
        linear-gradient(
            135deg,
            #06150e,
            #075c43,
            #07815b
        );
    box-shadow:0 5px 25px #0008;
}

.head{
    max-width:760px;
    margin:auto;
    padding:13px 12px;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(
            135deg,
            #00d084,
            #063e2c
        );
    font-weight:900;
    font-size:21px;
}

.brand h1{
    font-size:20px;
}

.brand p{
    font-size:10px;
    opacity:.8;
    margin-top:2px;
}

.live-badge{
    margin-left:auto;
    font-size:9px;
    font-weight:800;
    background:#0003;
    border-radius:20px;
    padding:7px 9px;
}

/* =========================
   NAVIGATION
========================= */

nav{
    display:flex;
    gap:4px;
    overflow-x:auto;
    margin-top:12px;
    scrollbar-width:none;
}

nav::-webkit-scrollbar{
    display:none;
}

.nav{
    border:0;
    background:#07120e88;
    color:#b8c4ca;
    border-radius:8px;
    padding:9px 12px;
    font-size:10px;
    font-weight:800;
    white-space:nowrap;
    cursor:pointer;
}

.nav.active{
    background:#00c878;
    color:#fff;
}

/* =========================
   MAIN
========================= */

main{
    max-width:760px;
    margin:auto;
    padding:10px 8px 35px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    gap:7px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:8px;
}

.toolbar::-webkit-scrollbar{
    display:none;
}

.tool{
    flex:none;
    border:1px solid var(--line);
    background:var(--panel);
    color:#cbd4d9;
    border-radius:8px;
    padding:8px 11px;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
}

.tool.active{
    background:var(--green2);
    border-color:var(--green);
    color:#fff;
}

/* =========================
   DATE BAR
========================= */

.datebar{
    display:flex;
    gap:6px;
    overflow-x:auto;
    scrollbar-width:none;
    margin-bottom:8px;
}

.datebar::-webkit-scrollbar{
    display:none;
}

.date{
    flex:none;
    min-width:86px;
    border:1px solid var(--line);
    background:var(--panel);
    color:#fff;
    border-radius:9px;
    padding:8px;
    text-align:center;
    cursor:pointer;
}

.date b{
    display:block;
    font-size:10px;
}

.date small{
    color:var(--muted);
    font-size:9px;
}

.date.active{
    background:var(--green2);
    border-color:var(--green);
}

/* =========================
   ACTIONS
========================= */

.actions{
    display:flex;
    gap:7px;
    margin-bottom:9px;
}

.action{
    flex:1;
    border:1px solid var(--line);
    background:var(--panel);
    color:#fff;
    border-radius:8px;
    padding:10px;
    font-size:10px;
    font-weight:800;
    cursor:pointer;
}

.action.primary{
    background:var(--green);
    border-color:var(--green);
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:8px;
    padding:8px;
    text-align:center;
    color:var(--muted);
    font-size:10px;
    margin-bottom:8px;
}

.status.show{
    display:block;
}

.status.error{
    color:#ff7781;
    border-color:#4b252b;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:45px;
    color:var(--muted);
    font-size:11px;
}

.spinner{
    width:27px;
    height:27px;
    border:3px solid #26323d;
    border-top-color:var(--green);
    border-radius:50%;
    margin:0 auto 12px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   LEAGUE
========================= */

.league{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:8px;
    overflow:hidden;
    margin-bottom:7px;
}

.league-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:#151e27;
    color:#dfe7eb;
    font-size:10px;
    font-weight:800;
}

.country{
    color:#7f8c97;
    font-weight:500;
}

.star{
    margin-left:auto;
    border:0;
    background:none;
    color:#65727d;
    cursor:pointer;
    font-size:13px;
}

.star.on{
    color:#ffc857;
}

/* =========================
   MATCH ROW
========================= */

.match{
    display:grid;
    grid-template-columns:
        45px
        1fr
        58px
        1fr
        28px;

    align-items:center;

    min-height:61px;

    border-top:1px solid #202a33;

    padding:7px 8px;

    cursor:pointer;
}

.match:hover{
    background:#ffffff03;
}

.kick{
    font-size:9px;
    color:#a8b3bb;
    text-align:center;
}

.kick.live{
    color:#ff5965;
    font-weight:900;
}

.team{
    font-size:10px;
    line-height:1.2;

    display:flex;
    align-items:center;
    gap:6px;

    min-width:0;
}

.team.away{
    justify-content:flex-start;
}

.team.home{
    justify-content:flex-end;
    text-align:right;
}

.team img{
    width:24px;
    height:24px;
    object-fit:contain;
    flex:none;
}

.team-name{
    overflow:hidden;
    text-overflow:ellipsis;
}

.score{
    text-align:center;
    font-size:14px;
    font-weight:900;
    white-space:nowrap;
}

.score .sub{
    display:block;
    font-size:8px;
    color:var(--muted);
    font-weight:600;
    margin-top:2px;
}

.arrow{
    text-align:center;
    color:#56636d;
    font-size:13px;
}

   EMPTY
========================= */

.empty{
    text-align:center;
    padding:50px 15px;

.empty .ball{

    margin-bottom:10px;
}

.empty b{

    color:#aeb8bf;
    font-size:14px;
    margin-bottom:6px;
}

.empty p{

========================= */

.page-title h2{

}

.page-title span{
    font-size:9px;

    overflow:hidden;
    margin-bottom:7px;

.country-head{

    font-weight:800;
    background:var(--panel2);

.country-head span{

.league-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:1px;
    background:var(--line);

.league-choice{

    padding:11px 10px;
    font-size:10px;
    cursor:pointer;

.league-choice:hover{

    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);

.standings{

.standings th{

.standings td{

.teamcell{

.teamcell img{

========================= */

    inset:0;
    background:#000c;
    z-index:100;
    display:none;
    overflow:auto;
    padding:12px 8px;

.modal.show{

    height:32px;
    border:0;
    border-radius:8px;
    background:#202b35;
    color:#fff;
    font-size:18px;
    cursor:pointer;

.info{

.info b{

    padding:8px 0;
    border-bottom:1px solid #202a33;
    font-size:9px;
}

.event-time{
    color:#8d99a5;

.event-main{
    text-align:center;
}

.stats-row{

    align-items:center;
    padding:7px 0;
    border-bottom:1px solid #202a33;
    font-size:8px;
    text-align:center;

    border:0;
    background:var(--green);
    color:#fff;
    border-radius:8px;
    padding:10px;

    font-weight:800;

/* =========================

    }

    .team img{
        width:22px;
        height:22px;
    }

    .league-list{
        grid-template-columns:1fr;
    }
}
</style>

function esc(value){

return String(value ?? "")

.replace(/&/g,"&amp;")

.replace(/</g,"&lt;")

.replace(/>/g,"&gt;")

.replace(/"/g,"&quot;")

.replace(/'/g,"&#039;");

}


function today(){

const d = new Date();

return iso(d);

}


function iso(d){

return d.getFullYear()

+

"-"

+

String(
d.getMonth()+1
).padStart(2,"0")

+

"-"

+

String(
d.getDate()
).padStart(2,"0");

}


function fmtTime(value){

if(!value){

return "-";

}

const d = new Date(value);

if(isNaN(d)){

return "-";

}

return d.toLocaleTimeString(

"en-NG",

{

hour:"2-digit",

minute:"2-digit",

hour12:false,

timeZone:"Africa/Lagos"

}

);

}


function fmtDate(value){

if(!value){

return "-";

}

const d = new Date(value);

if(isNaN(d)){

return "-";

}

return d.toLocaleDateString(

"en-NG",

{

weekday:"short",

day:"2-digit",

month:"short",

timeZone:"Africa/Lagos"

}

);

}

function dateControls(){

const d =
new Date(
date + "T12:00:00"
);

const arr = [];

for(
let i=-1;
i<=3;
i++
){

const x =
new Date(d);

x.setDate(
d.getDate()+i
);

const s =
iso(x);

let label;

if(i === 0){

}

else if(i === -1){

label = "Yesterday";

}

else if(i === 1){

}

else{

x.toLocaleDateString(

{
weekday:"short"
}
);

}

arr.push(`

? "active"
: ""
}"

onclick="setDate('${s}')"

>

<b>

${esc(
x.toLocaleDateString(
"en-NG",
{
day:"2-digit",
month:"short"
}
)
)}

</small>

</button>

`);

}

return `

<div class="datebar">

${arr.join("")}

</div>

}

/* =====================================================
   API
===================================================== */

async function fetchAPI(
action,
extra=""
){

const response =
await fetch(

API_BASE +

"?action=" +

action +

extra

);

const data =
await response.json();

if(!response.ok){

throw new Error(

data?.error ||

"API request failed"

);

}

return data;

}


/* =====================================================
   RESPONSE NORMALIZER
===================================================== */

function responseArray(data){

return (

data?.response

||

data?.data?.response

||

data?.data

||

[]

);

}


function rawMatch(x){

const fixture =
x?.fixture || x;

const league =
x?.league || {};

const teams =
x?.teams || {};

const goals =
x?.goals || {};

const score =
x?.score || {};

return {

id:
fixture?.id ||
x?.id,

date:
fixture?.date ||
x?.date ||
x?.utcDate,

status:
fixture?.status?.short ||
x?.status?.short ||
x?.status ||
"",

elapsed:
fixture?.status?.elapsed ||
x?.status?.elapsed,

leagueId:
league?.id ||
x?.leagueId,

leagueName:
league?.name ||
x?.leagueName ||
"Football",

country:
league?.country ||
x?.country ||
"",

home:
teams?.home?.name ||
x?.homeTeam?.name ||
x?.homeTeam ||
"Home",

away:
teams?.away?.name ||
x?.awayTeam?.name ||
x?.awayTeam ||
"Away",

homeLogo:
teams?.home?.logo ||
x?.homeTeam?.crest ||
x?.homeLogo,

awayLogo:
teams?.away?.logo ||
x?.awayTeam?.crest ||
x?.awayLogo,

homeScore:
goals?.home ??
score?.fulltime?.home ??
x?.homeScore,

awayScore:
goals?.away ??
score?.fulltime?.away ??
x?.awayScore,

venue:
fixture?.venue?.name ||
x?.venue?.name ||
x?.venue ||
"Not available",

city:
fixture?.venue?.city ||
x?.venue?.city ||
"",

referee:
fixture?.referee?.name ||
x?.referee?.name ||
"",

raw:x

};

}


function normalize(data){

return responseArray(data)

.map(rawMatch)

.filter(
x => x.id
);

}


/* =====================================================
   STATUS
===================================================== */

function liveStatus(status){

return [

"1H",
"HT",
"2H",
"ET",
"BT",
"P",
"LIVE"

].includes(

String(status)
.toUpperCase()

);

}


function finished(status){

return [

"FT",
"AET",
"PEN",
"CANC",
"ABD",
"AWD",
"WO"

].includes(

String(status)
.toUpperCase()

);

}


/* =====================================================
   MATCH ROW
===================================================== */

function matchRow(m){

const info =
leagueInfo(
m.leagueId,
m.leagueName,
m.country
);

const live =
liveStatus(m.status);

const fin =
finished(m.status);

let middle;

if(live || fin){

middle =

(m.homeScore ?? 0)

+

" - "

+

(m.awayScore ?? 0);

}

else{

middle = "VS";

}


let sub;

if(live){

sub =
m.elapsed
?
m.elapsed + "′ LIVE"
:
"LIVE";

}

else if(fin){

sub = "FT";

}

else{

sub = fmtTime(m.date);

}


return `

<div

class="match"

onclick="openMatch(${esc(m.id)})"

>

<div class="kick ${
live ? "live" : ""
}">

${

live

?

"🔴 " +

esc(
m.elapsed
?
m.elapsed + "′"
:
"LIVE"
)

:

esc(
fmtTime(m.date)
)

}

</div>


<div class="team home">

<span class="team-name">

${esc(m.home)}

</span>

${logo(
m.homeLogo,
m.home
)}

</div>


<div class="score">

${esc(middle)}

<span class="sub">

${esc(sub)}

</span>

</div>


<div class="team away">

${logo(
m.awayLogo,
m.away
)}

<span class="team-name">

${esc(m.away)}

</span>

</div>


<div class="arrow">

›

</div>

</div>

`;

}


/* =====================================================
   GROUP MATCHES
===================================================== */

function grouped(matches){

const groups = {};

matches.forEach(

m => {

const key =

(m.country || "International")

+

"|"

+

m.leagueId

+

"|"

+

m.leagueName;


if(!groups[key]){

groups[key] = {

country:
m.country ||
"International",

leagueId:
m.leagueId,

leagueName:
m.leagueName,

items:[]

};

}

groups[key].items.push(m);

}

);


return Object.values(groups)

.sort(

(a,b) =>

a.country.localeCompare(
b.country
)

)

.map(

group => `

<section class="league">

<div class="league-head">

<span class="country">

${esc(
leagueInfo(
group.leagueId,
group.leagueName,
group.country
).flag
)}

${esc(group.country)}

</span>


<span>

🏆

${esc(group.leagueName)}

</span>


<button

class="star ${
String(selectedLeague) ===
String(group.leagueId)
? "on"
: ""
}"

onclick="
event.stopPropagation();
selectLeague(${group.leagueId})
"

>

★

</button>

</div>


${group.items.map(
matchRow
).join("")}

</section>

`

).join("");

}

/* =====================================================
   LOAD DATA
===================================================== */

async function loadData(){

const content =
document.getElementById(
"content"
);

content.innerHTML = `

<div class="loading">

<div class="spinner"></div>

Loading real football data...

</div>

`;

try{

let data;


if(page === "live"){

data =
await fetchAPI(
"live"
);

}

else if(page === "fixtures"){

data =
await fetchAPI(
"fixtures",
"&date=" +
encodeURIComponent(date)
);

}

else if(page === "results"){

data =
await fetchAPI(
"results",
"&date=" +
encodeURIComponent(date)
);

}

else{

return render();

}


let matches =
normalize(data);


/*
FILTER ONLY WHEN
A LEAGUE IS SELECTED
FOR FIXTURES / RESULTS
*/

if(

page !== "live" &&

selectedLeague

){

matches =
matches.filter(

m =>

String(m.leagueId)

===

String(selectedLeague)

);

}


currentMatches =
matches;

renderContent(matches);

}

catch(error){

content.innerHTML = `

<div class="status show error">

Unable to load football data:

${esc(error.message)}

</div>

`;

}

}


/* =====================================================
   RENDER MATCH CONTENT
===================================================== */

function renderContent(matches){

document.getElementById(
"content"
).innerHTML =

(

page === "live"

?

controls()

:

dateControls() +
controls()

)

+

renderMatches(

matches,

page === "live"

?

"Live Matches"

:

page === "fixtures"

?

"Fixtures • " +
fmtDate(date)

:

"Results • " +
fmtDate(date)

);

}

function render(){
